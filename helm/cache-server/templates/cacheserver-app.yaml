{{- if and .Values.cacheServer.enabled (ne (int .Values.cacheServer.numServers) 0)}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cacheserver
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: cacheserver
  serviceName: cacheserver
  replicas: {{ .Values.cacheServer.numServers }}
  template:
    metadata:
      labels:
        app: cacheserver
{{- if .Values.managedById  }}
        kubernetes.azure.com/managedby: {{ .Values.managedById  }}
{{- end }}
{{- if and (not .Values.cacheServer.enableTrafficControl) .Values.cacheServer.egressBandwidthInGb }}
      annotations:
        kubernetes.io/egress-bandwidth: {{ .Values.cacheServer.egressBandwidthInGb }}G
{{- end }}
    spec:
      terminationGracePeriodSeconds: 10
{{- if .Values.cacheServer.scheduler.enabled }}
      schedulerName: cacheserver-scheduler
{{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: {{ .Values.cacheServer.nodeSelectorLabelKey }}
                operator: In
                values: {{ toYaml .Values.cacheServer.nodeSelectorLabelValues | nindent 16 }}
{{- if not .Values.cacheServer.useEphemeralStorage }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - cacheserver
            topologyKey: kubernetes.io/hostname
{{- end }}
      containers:
      - name: cacheserver
        image: "{{ .Values.cacheServer.image.repository }}:{{ .Values.cacheServer.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.cacheServer.image.imagePullPolicy | default "IfNotPresent" }}
        env:
        - name: CACHESERVER_THREADPOOL_SIZE
          value: {{ .Values.cacheServer.serverThreads | quote }}
        - name: CACHESERVER_TCP_BACKLOG_SIZE
          value: {{ .Values.cacheServer.tcpBacklogSize | quote }}
        - name: TEST_CACHESERVER_ADDR_PORT
          value: {{ .Values.cacheServer.port | quote }}
        - name: CACHESERVER_METRICS_PORT
          value: {{ .Values.cacheServer.metricsPort | quote }}
        - name: CACHESERVER_EVICTION_ENABLED
          value: {{ .Values.cacheServer.evictionEnabled | quote }}
        - name : CACHESERVER_EVICTION_LAST_ACCESS_THRESHOLD
          value : {{ .Values.cacheServer.evictionLastAccessThreshold | quote }}
        - name : CACHESERVER_EVICTION_SIZE_THRESHOLD
          value : {{ .Values.cacheServer.evictionSizeThreshold | quote }}
        - name : CACHESERVER_EVICTION_PASS_FREQUENCY
          value : {{ .Values.cacheServer.evictionPassFrequency | quote }}
        - name: CACHESERVER_EVICTION_MAINTAIN_FREE_SPACE
          value: {{ .Values.cacheServer.evictionMaintainFreeSpace | quote }}
        - name: CACHESERVER_EVICTION_SIZE_TARGET
          value: {{ .Values.cacheServer.evictionSizeTarget | quote }}
        - name: CACHESERVER_EVICTION_BUCKET_INTERVAL
          value: {{ .Values.cacheServer.evictionBucketInterval | quote }}
        - name: CACHESERVER_USE_ZEROCOPY
          value: {{ ternary "1" "0" .Values.cacheServer.useZeroCopy | quote }}
        - name: CACHESERVER_PORT
          value: {{ .Values.cacheServer.port | quote }}
        - name: CACHESERVER_CACHE_PATH
          value: {{ printf "%s/%s/cache" .Values.cacheServer.mountSsdPath .Values.cacheServer.identifier | quote }}
        - name: CACHESERVER_CACHE_SIZE_BYTES
          value: {{ mul .Values.cacheServer.serverSizeInGB 1024 1024 1024 | quote }}
        {{- if and .Values.cacheServer.enableTrafficControl .Values.cacheServer.egressBandwidthInGb }}
        - name: CACHESERVER_EGRESS_BANDWIDTH
          value: {{ printf "%vgbit" .Values.cacheServer.egressBandwidthInGb | quote }}
        - name: CACHESERVER_EGRESS_BURST
          value: {{ printf "%vmb" (mul .Values.cacheServer.egressBandwidthInGb 25) | quote }}
        {{- end }}
{{- if has "gpu" .Values.cacheServer.nodeSelectorLabelValues }}
        resources:
          requests:
            memory: "100Mi"
            cpu: "0.25"
            {{- if .Values.cacheServer.ibResourceCountLimit }}
            rdma/hca_rdma_infiniband: {{ .Values.cacheServer.ibResourceCountLimit | quote }}
            {{- end }}
          limits:
            memory: {{ (printf "%dMi" (int .Values.cacheServer.memoryLimitMB)) | quote }}
            cpu: {{ .Values.cacheServer.cpuLimit | quote }}
            {{- if .Values.cacheServer.ibResourceCountLimit }}
            rdma/hca_rdma_infiniband: {{ .Values.cacheServer.ibResourceCountLimit | quote }}
            {{- end }}
{{- end }}
        ports:
        - containerPort: {{ .Values.cacheServer.port }}
          name : cacheserver
        - containerPort: {{ .Values.cacheServer.metricsPort }}
          name : metrics
        {{- if and .Values.cacheServer.enableTrafficControl .Values.cacheServer.egressBandwidthInGb }}
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        {{- end }}
        command: ["/bin/sh", "-cx"]
        args:
        - |
          set -ex
          export CACHESERVER_HOSTNAME="$HOSTNAME"
          mkdir -p "$CACHESERVER_CACHE_PATH"

          {{- if and .Values.cacheServer.enableTrafficControl .Values.cacheServer.egressBandwidthInGb }}
          echo "Traffic control is enabled"
          BANDWIDTH="$CACHESERVER_EGRESS_BANDWIDTH"
          BURST="$CACHESERVER_EGRESS_BURST"
          for iface in $(ls -1 /sys/class/net); do
            # Ensure it's a directory and has a valid type file
            if [ -d "/sys/class/net/$iface" ] && [ -f "/sys/class/net/$iface/type" ]; then
              # Only proceed if it's a physical ethernet interface
              if [ "$(cat "/sys/class/net/$iface/type")" = "1" ]; then
                echo "Applying rate limiting to interface: $iface"
                echo "Setting bandwidth: $BANDWIDTH, burst: ${BURST}"
                if ! tc qdisc replace dev "$iface" root tbf rate "$BANDWIDTH" burst "$BURST" latency 1000ms; then
                  echo "Warning: Failed to apply rate limiting to $iface, continuing..."
                fi

                echo "Rate limiting configuration for $iface:"
                if ! tc qdisc show dev "$iface"; then
                  echo "Warning: Failed to show qdisc config for $iface, continuing..."
                fi
              fi
            fi
          done
          {{- else }}
          echo "Traffic control is disabled"
          {{- end }}

          /root/check_space_overuse.sh "$CACHESERVER_CACHE_PATH" "$CACHESERVER_CACHE_SIZE_BYTES"
          /root/CacheServer --port "$CACHESERVER_PORT" --cacheRoot "$CACHESERVER_CACHE_PATH" --sizeLimitBytes "$CACHESERVER_CACHE_SIZE_BYTES"
        volumeMounts:
        - mountPath: {{ .Values.cacheServer.mountSsdPath | quote }}
          name: cache-data-volume
          subPath: ssd0
        - name: cache-discovery-config
          mountPath: /serverConfig
          readOnly: true
        livenessProbe:
          exec:
            command: [
            '/bin/sh',
            '-c',
            '/root/LivenessProbe' ]
          initialDelaySeconds: 300
          periodSeconds: 120
          failureThreshold : 10
      volumes:
        - name: cache-data-volume
{{- if .Values.cacheServer.useEphemeralStorage }}
          emptyDir:
            sizeLimit: {{ (printf "%dGi" (add1 .Values.cacheServer.serverSizeInGB)) }}
{{- else if .Values.cacheServer.useHostPath }}
          hostPath:
            path: {{ .Values.cacheServer.nodeCacheFolderPath }}
            type: Directory
{{- else }}
          hostPath: null
          sizeLimit: null
{{- end }}
        - name: cache-discovery-config
          configMap:
            name: cacheserver-discovery-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cacheserver-discovery-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: cacheserver
data:
  cache_server_count: "{{ .Values.cacheServer.numServers }}"
  cache_server_endpoint_format: "cacheserver-{}.cacheserver.{{ .Release.Namespace }}.svc.cluster.local"
{{- end }}
