nodeSelector:
  dacs.azure.com/processing-unit: system

## Core Components Start
cacheServer:
  enabled: true
  image: cacheserver
  identifier: ""
  numServers: 3
  serverSizeInGB: 4
  serverThreads: 80
  cpuLimit: 4
  memoryLimitMB: 3200
  evictionEnabled: true
  evictionLastAccessThreshold: 30d
  evictionSizeThreshold: 90
  evictionPassFrequency: 1h
  #Enables eviction to maintain free space on the cache server.
  evictionMaintainFreeSpace: true
  evictionSizeTarget: 80
  mountSsdPath: /host/mnt/ssd0
  port: 9065
  metricsPort: 9096
  useEphemeralStorage: false
  ibResourceCountLimit: 0
  enableTrafficControl: true # If true, traffic control will be enabled for the cacheserver pods
  nodeCacheFolderPath: /var/lib/ssd/cacheserver # required when useEphemeralStorage is false and useHostPath is true.
  nodeSelectorLabelKey: dacs.azure.com/processing-unit
  nodeSelectorLabelValues: [ "cpu" ]
  useHostPath: true # If true, PV/PVC will not be created and cacheserver pods will use hostPath for storage
  scheduler:
    enabled: false
## Core Components end