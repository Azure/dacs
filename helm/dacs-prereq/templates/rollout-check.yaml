apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dacs-prereq.rolloutCheckName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "dacs-prereq.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dacs-prereq.rolloutCheckName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "dacs-prereq.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: [{{ .Values.name | quote }}]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dacs-prereq.rolloutCheckName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "dacs-prereq.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dacs-prereq.rolloutCheckName" . }}
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dacs-prereq.rolloutCheckName" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dacs-prereq.rolloutCheckName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "dacs-prereq.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ add .Values.rolloutCheck.timeoutSeconds 180 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: rollout-check
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dacs-prereq.rolloutCheckName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rollout-check
          image: {{ include "dacs-prereq.image" (dict "global" .Values.global "image" .Values.rolloutCheck.image "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.rolloutCheck.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.rolloutCheck.resources | nindent 12 }}
          env:
            - name: ROLLOUT_TIMEOUT_SECONDS
              value: {{ .Values.rolloutCheck.timeoutSeconds | quote }}
            - name: DAEMONSET
              value: {{ .Values.name | quote }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_SELECTOR
              value: {{ printf "app.kubernetes.io/name=%s,app.kubernetes.io/instance=%s" (include "dacs-prereq.name" .) .Release.Name | quote }}
          command:
            - /bin/sh
            - -c
            - |
              {{- .Files.Get "scripts/rollout-check.sh" | nindent 14 }}
