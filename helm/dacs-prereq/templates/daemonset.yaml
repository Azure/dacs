apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "dacs-prereq.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "dacs-prereq.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "dacs-prereq.selectorLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: nvme-raid-setup
    spec:
      hostPID: true
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.name }}
      initContainers:
        - name: nvme-raid-setup
          # The init container image must provide a package manager for
          # installing mdadm and related tools.  The default AzureLinux
          # image uses tdnf; setup-raid.sh falls back to apt-get for
          # Ubuntu-based images.
          image: "{{ .Values.nvmeRaidSetup.image.repository }}:{{ .Values.nvmeRaidSetup.image.tag }}"
          imagePullPolicy: {{ .Values.nvmeRaidSetup.image.pullPolicy }}
          securityContext:
            privileged: true
          env:
            - name: MOUNT_POINT
              value: "{{ .Values.mountPoint }}"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /bin/bash
            - -c
            - |
              set -e
              
              # Install required packages
              tdnf install -y util-linux
              
              # Execute setup script in host namespace via nsenter.
              # The single-quoted heredoc delimiter ('SETUP_SCRIPT') prevents
              # the outer shell from expanding variables.  However, nsenter
              # preserves the calling process environment (env is per-process,
              # not per-namespace), so the MOUNT_POINT variable set above is
              # available inside the nsenter'd shell.
              if ! nsenter -t 1 -m -u -i -n -p -- /bin/bash -s <<'SETUP_SCRIPT'
              export MOUNT_POINT="${MOUNT_POINT}"
              {{ .Files.Get "scripts/setup-raid.sh" | nindent 14 }}
              SETUP_SCRIPT
              then
                echo "NVMe setup failed -- emitting K8s Warning event"
                TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000000Z)
                curl -s -k -X POST \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d '{
                    "apiVersion": "events.k8s.io/v1",
                    "kind": "Event",
                    "metadata": {
                      "generateName": "nvme-setup-",
                      "namespace": "'"${POD_NAMESPACE}"'"
                    },
                    "eventTime": "'"${NOW}"'",
                    "action": "NVMeSetup",
                    "reason": "NVMeSetupFailed",
                    "note": "NVMe disk setup failed on node '"${NODE_NAME}"'. Check init container logs for details.",
                    "type": "Warning",
                    "regarding": {
                      "apiVersion": "v1",
                      "kind": "Node",
                      "name": "'"${NODE_NAME}"'"
                    },
                    "reportingController": "dacs-prereq",
                    "reportingInstance": "'"${POD_NAME}"'"
                  }' \
                  "https://kubernetes.default.svc/apis/events.k8s.io/v1/namespaces/${POD_NAMESPACE}/events" \
                  || true
                exit 1
              fi
          resources:
            {{- toYaml .Values.nvmeRaidSetup.resources | nindent 12 }}
      containers:
        - name: pause
          image: "{{ .Values.pauseContainer.image.repository }}:{{ .Values.pauseContainer.image.tag }}"
          imagePullPolicy: {{ .Values.pauseContainer.image.pullPolicy }}
          command:
            - sleep
            - infinity
          resources:
            {{- toYaml .Values.pauseContainer.resources | nindent 12 }}

