apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "dacs-prereq.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "dacs-prereq.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "dacs-prereq.selectorLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: nvme-raid-setup
    spec:
      hostPID: true
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.name }}
      initContainers:
        - name: nvme-raid-setup
          image: {{ include "dacs-prereq.image" (dict "global" .Values.global "image" .Values.nvmeRaidSetup.image "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.nvmeRaidSetup.image.pullPolicy }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-dev
              mountPath: /dev
          env:
            - name: MOUNT_POINT
              value: "{{ .Values.mountPoint }}"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /bin/bash
            - -c
            - |
              set -e
              
              # Keep the image's tools and use the node hostname for mdadm.
              # setup-raid.sh targets the host mount namespace explicitly.
              if ! nsenter -t 1 -u -- /bin/bash -s <<'SETUP_SCRIPT'
              export MOUNT_POINT="${MOUNT_POINT}"
              {{ .Files.Get "scripts/setup-raid.sh" | nindent 14 }}
              SETUP_SCRIPT
              then
                echo "NVMe setup failed -- emitting K8s Warning event"
                TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000000Z)
                curl -s --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt -X POST \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d '{
                    "apiVersion": "events.k8s.io/v1",
                    "kind": "Event",
                    "metadata": {
                      "generateName": "nvme-setup-",
                      "namespace": "'"${POD_NAMESPACE}"'"
                    },
                    "eventTime": "'"${NOW}"'",
                    "action": "NVMeSetup",
                    "reason": "NVMeSetupFailed",
                    "note": "NVMe disk setup failed on node '"${NODE_NAME}"'. Check init container logs for details.",
                    "type": "Warning",
                    "regarding": {
                      "apiVersion": "v1",
                      "kind": "Node",
                      "name": "'"${NODE_NAME}"'"
                    },
                    "reportingController": "dacs-prereq",
                    "reportingInstance": "'"${POD_NAME}"'"
                  }' \
                  "https://kubernetes.default.svc/apis/events.k8s.io/v1/namespaces/${POD_NAMESPACE}/events" \
                  || true
                exit 1
              fi
          resources:
            {{- toYaml .Values.nvmeRaidSetup.resources | nindent 12 }}
      containers:
        - name: pause
          image: {{ include "dacs-prereq.image" (dict "global" .Values.global "image" .Values.pauseContainer.image "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.pauseContainer.image.pullPolicy }}
          command:
            - sleep
            - infinity
          resources:
            {{- toYaml .Values.pauseContainer.resources | nindent 12 }}
      volumes:
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
