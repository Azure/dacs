suite: prerequisite rollout image configuration
templates:
  - rollout-check.yaml
set:
  # Registry behavior must preserve the supplied tag, not pin a release default.
  rolloutCheck.image.tag: registry-test
tests:
  - it: preserves the rollout repository and supplied tag without pull secrets
    documentSelector: &job
      path: kind
      value: Job
    asserts:
      - equal:
          path: apiVersion
          value: v1
        documentSelector:
          path: kind
          value: ServiceAccount
      - equal:
          path: spec.template.spec.containers[0].image
          value: mcr.microsoft.com/oss/v2/kubernetes/kubectl:registry-test
      - notExists:
          path: spec.template.spec.imagePullSecrets
  - it: ignores the global registry in legacy mode
    documentSelector: *job
    set:
      global.registry: mirror.example
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: mcr.microsoft.com/oss/v2/kubernetes/kubectl:registry-test
  - it: localizes the rollout image and propagates credentials in replace mode
    documentSelector: *job
    set:
      global.registryMode: replace
      global.registry: mirror.example/project/
      global.imagePullSecrets: &secrets [{name: registry-auth}]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: mirror.example/project/oss/v2/kubernetes/kubectl:registry-test
      - equal:
          path: spec.template.spec.imagePullSecrets
          value: *secrets
  - it: honors an explicit rollout registry in legacy mode without enabling global replacement
    documentSelector: *job
    set:
      global.registry: mirror.example
      global.imagePullSecrets: *secrets
      rolloutCheck.image.registry: tools.example:5000/project/
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: tools.example:5000/project/oss/v2/kubernetes/kubectl:registry-test
      - equal:
          path: spec.template.spec.imagePullSecrets
          value: *secrets
  - it: gives the rollout registry precedence in replacement mode
    documentSelector: *job
    set:
      global.registryMode: replace
      global.registry: mirror.example
      rolloutCheck.image.registry: tools.example
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: tools.example/oss/v2/kubernetes/kubectl:registry-test
  - it: rejects a malformed rollout registry
    set:
      rolloutCheck.image.registry: https://tools.example
    asserts:
      - failedTemplate:
          errorPattern: registry
