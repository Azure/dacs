# Default values for dacs-prereq

# Base name used for all resources (DaemonSet, ServiceAccount, Role, RoleBinding)
name: dacs-prereq

# Node selector for targeting NVMe-capable nodes
nodeSelector:
  dacs.azure.com/processing-unit: cpu

# Tolerations for the DaemonSet
tolerations: []

# Mount point for the RAID array
mountPoint: /var/lib/ssd/cacheserver

# Priority class for the DaemonSet pods.
# system-node-critical ensures NVMe setup runs before application pods and
# survives eviction during node pressure.
priorityClassName: system-node-critical

# DaemonSet update strategy
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: "10%"

# nvme-raid-setup init container settings
nvmeRaidSetup:
  image:
    repository: mcr.microsoft.com/azurelinux/base/core
    tag: "3.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 512Mi

# Pause container settings
pauseContainer:
  image:
    repository: mcr.microsoft.com/azurelinux/base/core
    tag: "3.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 1m
      memory: 16Mi
    limits:
      cpu: 10m
      memory: 16Mi

