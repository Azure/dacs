apiVersion: v1
kind: Pod
metadata:
  name: iperf-server
  namespace: default
  labels:
    app: iperf-server
    dacs.azure.com/test-pod: "true"
spec:
  nodeName: ""
  containers:
  - name: iperf
    image: mcr.microsoft.com/azurelinux/base/core:3.0
    command:
    - /bin/sh
    - -c
    - tdnf install -y iperf3 && iperf3 -s -f m
    ports:
    - containerPort: 5201
      protocol: TCP
  restartPolicy: Never
