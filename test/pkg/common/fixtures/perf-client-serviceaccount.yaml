# ServiceAccount for workload identity authentication with Azure
# The annotation azure.workload.identity/client-id must be set to the
# managed identity client ID created by the workload-identity.bicep template
apiVersion: v1
kind: ServiceAccount
metadata:
  name: perf-client-sa
  namespace: cache-server
  annotations:
    # This will be dynamically set when deploying
    azure.workload.identity/client-id: ""
