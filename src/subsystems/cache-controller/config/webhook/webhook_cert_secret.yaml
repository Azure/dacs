# Secret to store webhook server TLS certificates
# The cert-controller will populate this secret with generated certificates
apiVersion: v1
kind: Secret
metadata:
  name: webhook-server-cert
  namespace: system
  labels:
    app.kubernetes.io/name: cache-controller
    app.kubernetes.io/component: webhook
type: kubernetes.io/tls
data:
  # cert-controller will populate these fields
  tls.crt: ""
  tls.key: ""
  ca.crt: ""
