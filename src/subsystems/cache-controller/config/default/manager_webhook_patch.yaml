# Patch to add webhook arguments to manager deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        args:
        - "--health-probe-bind-address=:8081"
        - "--metrics-bind-address=:8443"
        - "--metrics-secure=true"
        - "--leader-elect"
        - "--enable-webhooks=true"
        - "--webhook-cert-path=/tmp/k8s-webhook-server/serving-certs"
        - "--cert-secret-name=cache-controller-webhook-server-cert"
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: webhook-cert
          readOnly: true
      volumes:
      - name: webhook-cert
        secret:
          defaultMode: 420
          secretName: webhook-server-cert
