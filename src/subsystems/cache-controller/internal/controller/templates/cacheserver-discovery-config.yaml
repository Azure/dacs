apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Name }}-discovery-config
  namespace: {{ .Namespace }}
  labels:
    app: cacheserver
    dacs.azure.com/cache-name: {{ .Name }}
data:
  cache_server_count: "{{ .NumServers }}"
  cache_server_endpoint_format: "{{ .Name }}-{}.{{ .Name }}.{{ .Namespace }}.svc.cluster.local"