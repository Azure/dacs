apiVersion: v1
kind: Service
metadata:
  name: {{ .Name }}
  labels:
    app: cacheserver
    dacs.azure.com/cache-name: {{ .Name }}
  namespace: {{ .Namespace }}
spec:
  ports:
  - name: cacheserver
    port: {{ .Port }}
    targetPort: {{ .Port }}
  - name: metrics
    port: {{ .MetricsPort }}
    targetPort: {{ .MetricsPort }}
  clusterIP: None
  selector:
    app: cacheserver
    dacs.azure.com/cache-name: {{ .Name }}