apiVersion: v1
kind: Service
metadata:
  name: {{ .Name }}-discovery
  labels:
    app: cacheserver
    dacs.azure.com/cache-name: {{ .Name }}
  namespace: {{ .Namespace }}
spec:
  ports:
  - name: cacheserver
    port: {{ .Port }}
    targetPort: {{ .Port }}
  selector:
    app: cacheserver
    dacs.azure.com/cache-name: {{ .Name }}