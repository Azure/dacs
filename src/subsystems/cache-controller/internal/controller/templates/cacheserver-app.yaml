apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
  labels:
    app: cacheserver
    dacs.azure.com/cache-name: {{ .Name }}
spec:
  selector:
    matchLabels:
      app: cacheserver
      dacs.azure.com/cache-name: {{ .Name }}
  serviceName: {{ .Name }}
  replicas: {{ .NumServers }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: "10%"
  template:
    metadata:
      labels:
        app: cacheserver
        dacs.azure.com/cache-name: {{ .Name }}
        kubernetes.azure.com/managedby: {{ .ManagedById }}
{{- if .EgressBandwidthInGb }}
      annotations:
        kubernetes.io/egress-bandwidth: {{ .EgressBandwidthInGb }}G
{{- end }}
    spec:
      terminationGracePeriodSeconds: 10
{{- if ne .UseEphemeralStorage true }}
      schedulerName: cache-controller
{{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: {{ toJSON .NodeSelectorLabelKey }}
                operator: In
                values: {{ toJSON .NodeSelectorValue }}
{{- if ne .UseEphemeralStorage true }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - cacheserver
            topologyKey: kubernetes.io/hostname
{{- end }}
      containers:
      - name: cacheserver
        image: {{ .Image }}
        imagePullPolicy: {{ .ImagePullPolicy }}
        env:
        - name: CACHESERVER_THREADPOOL_SIZE
          value: "{{ .ServerThreads }}"
        - name: TEST_CACHESERVER_ADDR_PORT
          value: "{{ .Port }}"
        - name: CACHESERVER_METRICS_PORT
          value: "{{ .MetricsPort }}"
        - name: CACHESERVER_EVICTION_ENABLED
          value: "{{ .EnableAccessTimeEviction }}"
        - name: CACHESERVER_EVICTION_LAST_ACCESS_THRESHOLD
          value: {{ toJSON .EvictionLastAccessThreshold }}
        - name: CACHESERVER_EVICTION_SIZE_THRESHOLD
          value: {{ toJSON .EvictionSizeThreshold }}
        - name: CACHESERVER_EVICTION_PASS_FREQUENCY
          value: {{ toJSON .EvictionPassFrequency }}
        - name: CACHESERVER_EVICTION_MAINTAIN_FREE_SPACE
          value: "{{ .EvictionMaintainFreeSpace }}"
        - name: CACHESERVER_EVICTION_SIZE_TARGET
          value: {{ toJSON .EvictionSizeTarget }}
        - name: CACHESERVER_EVICTION_BUCKET_INTERVAL
          value: {{ toJSON .EvictionBucketInterval }}
        - name: CACHESERVER_USE_ZEROCOPY
          value: "{{- if .UseZeroCopy }}1{{- else }}0{{- end }}"
        - name: CACHESERVER_PORT
          value: "{{ .Port }}"
        - name: CACHESERVER_CACHE_PATH
          value: {{ printf "%s/%s/cache" .MountSsdPath .Name | toJSON }}
        - name: CACHESERVER_CACHE_SIZE_BYTES
          value: "{{ mulAll .ServerSizeInGB 1024 1024 1024 }}"
        - name: CACHESERVER_SNAPSHOT_INTERVAL
          value: "{{ .SnapshotIntervalSeconds }}"
        {{- if and .EgressBandwidthInGb }}
        - name: CACHESERVER_EGRESS_BANDWIDTH
          value: "{{ .EgressBandwidthInGb }}gbit"
        - name: CACHESERVER_EGRESS_BURST
          value: "{{ mulAll .EgressBandwidthInGb 25 }}mb"
        {{- end }}
        resources:
          requests:
            memory: "{{- if .DisableMemoryRequest }}0{{- else }}100Mi{{- end }}"
            cpu: "{{- if .DisableCpuRequest }}0{{- else }}0.25{{- end }}"
            {{- if and .InfinibandResourceLimitName (gt .InfinibandResourceLimitCount 0) }}
            {{ toJSON .InfinibandResourceLimitName }}: {{ .InfinibandResourceLimitCount }}
            {{- end }}
          limits:
            {{- if .MemoryLimitMB }}
            memory: "{{ .MemoryLimitMB -}}Mi"
            {{- end }}
            {{- if .CpuLimit }}
            cpu: "{{ .CpuLimit }}"
            {{- end }}
            {{- if and .InfinibandResourceLimitName (gt .InfinibandResourceLimitCount 0) }}
            {{ toJSON .InfinibandResourceLimitName }}: {{ .InfinibandResourceLimitCount }}
            {{- end }}
        ports:
        - containerPort: {{ .Port }}
          name : cacheserver
        - containerPort: {{ .MetricsPort }}
          name : metrics
        {{- if .EgressBandwidthInGb }}
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        {{- end }}
        command: ["/bin/sh", "-cx"]
        args:
        - |
          set -ex
          export CACHESERVER_HOSTNAME="$HOSTNAME"
          mkdir -p "$CACHESERVER_CACHE_PATH"

          {{- if and .EgressBandwidthInGb }}
          echo "Traffic control is enabled"
          BANDWIDTH="$CACHESERVER_EGRESS_BANDWIDTH"
          BURST="$CACHESERVER_EGRESS_BURST"
          for iface in $(ls -1 /sys/class/net); do
            # Ensure it's a directory and has a valid type file
            if [ -d "/sys/class/net/$iface" ] && [ -f "/sys/class/net/$iface/type" ]; then
              # Only proceed if it's a physical ethernet interface
              if [ "$(cat "/sys/class/net/$iface/type")" = "1" ]; then
                echo "Applying rate limiting to interface: $iface"
                echo "Setting bandwidth: $BANDWIDTH, burst: ${BURST}"
                if ! tc qdisc replace dev "$iface" root tbf rate "$BANDWIDTH" burst "$BURST" latency 1000ms; then
                  echo "Warning: Failed to apply rate limiting to $iface, continuing..."
                fi

                echo "Rate limiting configuration for $iface:"
                if ! tc qdisc show dev "$iface"; then
                  echo "Warning: Failed to show qdisc config for $iface, continuing..."
                fi
              fi
            fi
          done
          {{- else }}
          echo "Traffic control is disabled"
          {{- end }}

          /root/check_space_overuse.sh "$CACHESERVER_CACHE_PATH" "$CACHESERVER_CACHE_SIZE_BYTES"
          /root/CacheServer --port "$CACHESERVER_PORT" --cacheRoot "$CACHESERVER_CACHE_PATH" --sizeLimitBytes "$CACHESERVER_CACHE_SIZE_BYTES"
        volumeMounts:
        - mountPath: {{ toJSON .MountSsdPath }}
          name: cache-data-volume
          subPath: ssd0
        - name: cache-discovery-config
          mountPath: /serverConfig
          readOnly: true
        livenessProbe:
          exec:
            command: [
            '/bin/sh',
            '-c',
            '/root/LivenessProbe' ]
          initialDelaySeconds: 300
          periodSeconds: 120
          failureThreshold : 10
      volumes:
        - name: cache-data-volume
{{- if .UseEphemeralStorage }}
          emptyDir:
            sizeLimit: "{{add .ServerSizeInGB 5}}Gi"
{{- else if .UseHostPath }}
          hostPath:
            path: {{ toJSON .NodeCacheFolderPath }}
            type: Directory
{{- else }}
          hostPath: null
          sizeLimit: null
{{- end }}
        - name: cache-discovery-config
          configMap:
            name: {{ .Name }}-discovery-config