suite: controller tolerations and standalone Cache configuration
templates:
  - manager/manager.yaml
  - validate-cache-values.yaml
tests:
  - it: retains default controller tolerations
    template: manager/manager.yaml
    asserts:
      - equal:
          path: spec.template.spec.tolerations
          value: [{key: CriticalAddonsOnly, operator: Exists}]
  - it: renders custom controller tolerations
    template: manager/manager.yaml
    set:
      manager.tolerations: &controller [{key: controller-only, operator: Exists}]
    asserts:
      - equal:
          path: spec.template.spec.tolerations
          value: *controller
  - it: rejects obsolete chart-managed Cache configuration
    template: validate-cache-values.yaml
    set:
      cache.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: cache
