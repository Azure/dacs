                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: environment variable names must start with STORAGE_ or
                    CACHESERVER_
                  rule: self.all(envVar, envVar.name.startsWith('STORAGE_') || envVar.name.startsWith('CACHESERVER_'))
              eviction:
                description: Eviction settings
                properties:
                  bucketInterval:
                    default: 15m
                    description: |-
                      Access-time bucket width used by the maintain-free-space (dynamic) eviction path,
                      example "15m", "1h", "60s". A smaller interval evicts more precisely (less over-eviction).
                      Must be at most 1 week; invalid/too-large values fall back to the server default.
                    type: string
                  enableAccessTimeEviction:
                    default: true
                    description: Enable accessTime based eviction
                    type: boolean
                  evictionMaintainFreeSpace:
                    default: true
                    description: Keep a portion of cache space always free even if
                      all data is within access time window
                    type: boolean
                  lastAccessThreshold:
                    default: 30d
                    description: Last Access threshold for cache eviction, example
                      "30d12h41m29s"
                    type: string
                  passFrequency:
                    default: 15m
                    description: Frequency of running eviction pass, example "1h30m"
                    type: string
                  sizeTarget:
                    default: "80"
                    description: |-
                      Target cache utilization percentage after eviction (0-100).
                      Eviction runs until cache utilization drops to this level.
                      Must be less than SizeThreshold to avoid continuous eviction cycles.
                    type: string
                  sizeThreshold:
                    default: "90"
                    description: |-
                      Size threshold for triggering cache eviction in percentage (0-100).
                      Eviction starts when cache utilization exceeds this value.
                    type: string
