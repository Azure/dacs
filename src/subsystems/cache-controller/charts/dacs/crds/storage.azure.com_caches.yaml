                description: |-
                  Scaling configuration for cache servers
                  Specify either dynamic or static (mutually exclusive)
                properties:
                  dynamic:
                    description: Dynamic configuration for scaling based on node availability
                    properties:
                      maxServers:
                        description: |-
                          Maximum number of cache servers to run. The replica count will never
                          exceed this value regardless of the percentage calculation.
                        format: int32
                        maximum: 499
                        minimum: 1
                        type: integer
                      minServers:
                        description: |-
                          Minimum number of cache servers to run. If the percentage-based count
                          falls below this threshold, the replica count is floored to 0 instead
                          of being clamped up - the cache will not run at all until enough nodes
                          are available to meet the minimum.
                        format: int32
                        maximum: 499
                        minimum: 1
                        type: integer
                      percentageOfNodesToUse:
                        description: Percentage of available nodes to use for cache
                          servers
                        format: int32
                        maximum: 100
                        minimum: 1
                        type: integer
                    required:
                    - percentageOfNodesToUse
                    type: object
                  static:
                    description: Static configuration for a fixed number of cache
                      servers
                    properties:
                      numServers:
                        description: Number of cache server replicas to maintain
                        format: int32
                        maximum: 499
                        minimum: 1
                        type: integer
                    required:
                    - numServers
                    type: object
                type: object
              serverSizeInGB:
                description: Max allowed cache size in GB per cache server
                format: int32
                minimum: 1
                type: integer
              serverThreads:
                description: Number of threads per cache server
                format: int32
                minimum: 4
                type: integer
              storage:
                description: Storage configuration for cache data. Default is hostPath
                  storage with path /var/lib/ssd/cacheserver
                properties:
                  ephemeral:
                    description: Use ephemeral storage for cache data storage
                    type: boolean
                  hostPath:
                    description: Use hostPath volume for cache data storage
                    properties:
                      nodeCacheFolderPath:
                        description: Node cache folder path (used if useHostPath is
                          true)
                        type: string
                    required:
                    - nodeCacheFolderPath
                    type: object
                type: object
              tolerations:
                description: Tolerations for CacheServer pods, independent of controller
                  pod tolerations.
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            required:
