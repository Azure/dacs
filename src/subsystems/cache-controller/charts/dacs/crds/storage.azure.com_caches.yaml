            - serverThreads
            type: object
          status:
            description: status defines the observed state of Cache
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the Cache resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  All conditions use positive polarity (True = good/healthy). This aligns with the
                  kstatus convention so that tooling such as `kubectl wait --for=condition=Ready` works
                  out of the box. See https://github.com/kubernetes-sigs/cli-utils/blob/master/pkg/kstatus/README.md

                  Condition types:
                  - "Ready": overall readiness derived from all other conditions
                  - "ReplicasReady": whether the desired number of StatefulSet replicas are running and ready
                  - "PodsScheduled": whether all cache server pods have been successfully scheduled.
                    False when pods are stuck pending or scheduling errors occurred.

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentServers:
                description: Current number of cache server pods
                format: int32
                type: integer
              desiredServers:
                description: Desired number of cache server pods
                format: int32
                type: integer
              discoveryURL:
                description: |-
                  The discovery URL for the cache.
                  Pass this to cache client to connect to cache.
                type: string
              scaling:
                description: |-
                  Scaling reports the state of the scaling normalizer's stabilization
                  window. Nil when static scaling is configured or when the scaling
                  calculation could not be performed.
                properties:
                  message:
                    description: Human-readable summary of the current scaling state.
                    type: string
                  stabilizationEnds:
                    description: |-
                      When the current stabilization window expires. Nil when
                      scaling has settled.
                    format: date-time
                    type: string
                  targetServers:
                    description: |-
                      The server count the scaling algorithm computed. When a
                      stabilization window is active this is the count the system
                      would apply once the window expires. Nil on error paths where
                      the target could not be determined.
                    format: int32
                    type: integer
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: must specify metadata.name or metadata.generateName
          rule: has(self.metadata.name) || has(self.metadata.generateName)
        - message: metadata.name must be at most 53 characters; the controller appends
            suffixes up to 10 characters to create Service names, which are limited
            to 63
          rule: '!has(self.metadata.name) || size(self.metadata.name) <= 53'
        - message: 'metadata.name must be a valid RFC 1123 DNS label: lowercase alphanumeric
            and hyphens, must start and end with alphanumeric'
          rule: '!has(self.metadata.name) || self.metadata.name.matches(''^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'')'
        - message: metadata.name must not end with '-discovery'; that suffix is reserved
            for the discovery Service derived from another Cache and would cause a
            Service name collision
          rule: '!has(self.metadata.name) || !self.metadata.name.endsWith(''-discovery'')'
        - message: metadata.generateName must be at most 48 characters; the apiserver
            appends a 5-char suffix and the controller appends suffixes up to 10 characters
            to create Service names, which are limited to 63
          rule: '!has(self.metadata.generateName) || size(self.metadata.generateName)
            <= 48'
        - message: 'metadata.generateName must be a valid RFC 1123 DNS label prefix:
