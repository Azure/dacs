apiVersion: storage.azure.com/v1
kind: Cache
metadata:
  name: cache-sample
  labels:
    app.kubernetes.io/name: dacs
    app.kubernetes.io/instance: cache-sample
    app.kubernetes.io/version: example
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: dacs
    app.kubernetes.io/managed-by: kubectl
    dacs.azure.com/example: "true"
spec:
  scaling:
    dynamic:
      percentageOfNodesToUse: 100
  serverSizeInGB: 1000
  serverThreads: 80
  port: 9065
  metricsPort: 9096
  cpuLimit: 4
  memoryLimitMB: 128000
  nodeSelectorKey: dacs.azure.com/processing-unit
  nodeSelectorValue: cpu
  eviction:
    enableAccessTimeEviction: true
    evictionMaintainFreeSpace: true
    lastAccessThreshold: 30d
    passFrequency: 15m
    sizeTarget: "80"
    sizeThreshold: "90"
    bucketInterval: 15m
  storage:
    hostPath:
      nodeCacheFolderPath: /var/lib/ssd/cacheserver
