  {{- if .Values.cache.enabled }}
apiVersion: storage.azure.com/v1
kind: Cache
metadata:
  name: {{ .Values.cache.name }}
  namespace: {{ .Values.cache.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dacs
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  scaling:
    {{- if .Values.cache.scaling.dynamic }}
    dynamic:
      {{- with .Values.cache.scaling.dynamic }}
      percentageOfNodesToUse: {{ .percentageOfNodesToUse }}
      {{- if ne .minServers nil }}
      minServers: {{ .minServers }}
      {{- end }}
      {{- if ne .maxServers nil }}
      maxServers: {{ .maxServers }}
      {{- end }}
      {{- end }}
    {{- else if .Values.cache.scaling.static }}
    static:
      numServers: {{ .Values.cache.scaling.static.numServers }}
    {{- end }}
  serverSizeInGB: {{ .Values.cache.serverSizeInGB }}
  serverThreads: {{ .Values.cache.serverThreads }}
  {{- with .Values.cache.port }}
  port: {{ . }}
  {{- end }}
  {{- with .Values.cache.metricsPort }}
  metricsPort: {{ . }}
  {{- end }}
  {{- with .Values.cache.nodeSelectorKey }}
  nodeSelectorKey: {{ . | quote }}
  {{- end }}
  {{- with .Values.cache.nodeSelectorValue }}
  nodeSelectorValue: {{ . | quote }}
  {{- end }}
  {{- if ne .Values.cache.cpuLimit nil }}
  cpuLimit: {{ .Values.cache.cpuLimit }}
  {{- end }}
  {{- if ne .Values.cache.memoryLimitMB nil }}
  memoryLimitMB: {{ .Values.cache.memoryLimitMB }}
  {{- end }}
  {{- with .Values.cache.egressBandwidthLimitGbps }}
  egressBandwidthLimitGbps: {{ . }}
  {{- end }}
  eviction:
    enableAccessTimeEviction: {{ .Values.cache.eviction.enableAccessTimeEviction }}
    evictionMaintainFreeSpace: {{ .Values.cache.eviction.evictionMaintainFreeSpace }}
    lastAccessThreshold: {{ .Values.cache.eviction.lastAccessThreshold | quote }}
    passFrequency: {{ .Values.cache.eviction.passFrequency | quote }}
    sizeTarget: {{ .Values.cache.eviction.sizeTarget | quote }}
    sizeThreshold: {{ .Values.cache.eviction.sizeThreshold | quote }}
    bucketInterval: {{ .Values.cache.eviction.bucketInterval | quote }}
  storage:
    {{- if .Values.cache.storage.ephemeral }}
    ephemeral: true
    {{- else }}
    hostPath:
      nodeCacheFolderPath: {{ .Values.cache.storage.hostPath.nodeCacheFolderPath | quote }}
    {{- end }}
  {{- /* InfiniBand resource configuration - only include when count > 0 */}}
  {{- if and .Values.cache.infinibandResourceLimitName (gt (int (.Values.cache.infinibandResourceLimitCount | default 0)) 0) }}
  infinibandResourceLimitCount: {{ .Values.cache.infinibandResourceLimitCount | int }}
  infinibandResourceLimitName: {{ .Values.cache.infinibandResourceLimitName | quote }}
  {{- end }}
{{- end }}
