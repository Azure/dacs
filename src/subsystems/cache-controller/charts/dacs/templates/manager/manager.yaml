apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: {{ include "chart.name" . }}
        control-plane: controller-manager
    name: {{ include "chart.fullname" . }}-manager
    namespace: {{ .Release.Namespace }}
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: {{ include "chart.name" . }}
            control-plane: controller-manager
    template:
        metadata:
            annotations:
                kubectl.kubernetes.io/default-container: manager
            labels:
                app.kubernetes.io/name: {{ include "chart.name" . }}
                app.kubernetes.io/instance: {{ .Release.Name }}
                control-plane: controller-manager
        spec:
            containers:
                - args:
                    {{- if .Values.metrics.enable }}
                    - --metrics-bind-address=:{{ .Values.metrics.port }}
                    {{- else }}
                    # Bind to :0 to disable the controller-runtime managed metrics server
                    - --metrics-bind-address=0
                    {{- end }}
                    - --health-probe-bind-address=:8081
                    - --leader-elect
                    - --namespace={{ .Release.Namespace }}
                    {{- range .Values.manager.extraArgs }}
                    - {{ . }}
                    {{- end }}
                    {{- if .Values.webhook.enable }}
                    - --enable-webhooks=true
                    - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
                    - --cert-secret-name={{ include "chart.fullname" . }}-webhook-server-cert
                    - --webhook-service-name={{ include "chart.fullname" . }}-webhook-service
                    - --mutating-webhook-config-name={{ include "chart.fullname" . }}-mutating-webhook-configuration
                    - --validating-webhook-config-name={{ include "chart.fullname" . }}-validating-webhook-configuration
                    {{- end }}
                  command:
                    - /manager
                  env:
                    - name: CACHE_CONTROLLER_CACHESERVERIMAGE
                      value: "{{ include "chart.image" (dict "global" .Values.global "repository" .Values.manager.cacheServerImage.repository "tag" .Values.manager.cacheServerImage.tag) }}"
                    - name: CACHE_CONTROLLER_IMAGEPULLPOLICY
                      value: {{ .Values.manager.image.pullPolicy | quote }}
                    {{- if .Values.manager.env }}
                    {{- toYaml .Values.manager.env | nindent 20 }}
                    {{- end }}
                  image: "{{ include "chart.image" (dict "global" .Values.global "repository" .Values.manager.image.repository "tag" .Values.manager.image.tag) }}"
                  imagePullPolicy: {{ .Values.manager.image.pullPolicy }}
                  livenessProbe:
                    httpGet:
                        path: /healthz
                        port: 8081
                    initialDelaySeconds: 15
                    periodSeconds: 20
                  name: manager
                  {{- if .Values.webhook.enable }}
                  ports:
                    - containerPort: 9443
                      name: webhook-server
                      protocol: TCP
                  {{- end }}
                  readinessProbe:
                    httpGet:
                        path: /readyz
                        port: 8081
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  resources:
                    {{- if .Values.manager.resources }}
                    {{- toYaml .Values.manager.resources | nindent 20 }}
                    {{- else }}
                    {}
                    {{- end }}
                  securityContext:
                    {{- if .Values.manager.securityContext }}
                    {{- toYaml .Values.manager.securityContext | nindent 20 }}
                    {{- else }}
                    {}
                    {{- end }}
                  {{- if .Values.webhook.enable }}
                  volumeMounts:
                    - mountPath: /tmp/k8s-webhook-server/serving-certs
                      name: webhook-cert
                      readOnly: true
                  {{- end }}
            securityContext:
              {{- if .Values.manager.podSecurityContext }}
              {{- toYaml .Values.manager.podSecurityContext | nindent 14 }}
              {{- else }}
              {}
              {{- end }}
            serviceAccountName: {{ include "chart.serviceAccountName" . }}
            terminationGracePeriodSeconds: 10
            {{- if .Values.webhook.enable }}
            volumes:
              - name: webhook-cert
                secret:
                  defaultMode: 420
                  secretName: {{ include "chart.fullname" . }}-webhook-server-cert
            {{- end }}
