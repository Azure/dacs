{{- if .Values.webhook.enable }}
# Secret to store webhook server TLS certificates
# The cert-controller will populate this secret with generated certificates
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
  name: dacs-webhook-server-cert
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/tls
data:
  # cert-controller will populate these fields
  tls.crt: ""
  tls.key: ""
  ca.crt: ""
{{- end }}
