{{- if .Values.webhook.enable }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
  name: dacs-mutating-webhook-configuration
spec:
  webhooks:
    - admissionReviewVersions:
        - v1
      clientConfig:
        service:
          name: dacs-webhook-service
          namespace: {{ .Release.Namespace }}
          path: /mutate-storage-azure-com-v1-cache
      failurePolicy: {{ .Values.webhook.failurePolicy | default "Fail" }}
      name: mutate.cache.storage.azure.com
      rules:
        - apiGroups:
            - storage.azure.com
          apiVersions:
            - v1
          operations:
            - CREATE
            - UPDATE
          resources:
            - caches
      sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
  name: dacs-validating-webhook-configuration
spec:
  webhooks:
    - admissionReviewVersions:
        - v1
      clientConfig:
        service:
          name: dacs-webhook-service
          namespace: {{ .Release.Namespace }}
          path: /validate-storage-azure-com-v1-cache
      failurePolicy: {{ .Values.webhook.failurePolicy | default "Fail" }}
      name: validate.cache.storage.azure.com
      rules:
        - apiGroups:
            - storage.azure.com
          apiVersions:
            - v1
          operations:
            - CREATE
            - UPDATE
          resources:
            - caches
      sideEffects: None
{{- end }}
