# Name prefix for all resources (e.g., dacs-manager, dacs-webhook)
namePrefix: dacs

# Configure the controller manager deployment
manager:
  replicas: 1
  # Namespace for controller deployment (defaults to Release.Namespace)
  namespace: ""

  # Controller log level passed via CACHE_CONTROLLER_LOGLEVEL (e.g. trace, debug, info, warn, error)
  logLevel: info
  
  image:
    repository: acstor/dacs-controller
    tag: ""  # Empty defaults to .Chart.AppVersion (e.g. "local" for dev, build number for published charts)
    pullPolicy: IfNotPresent

  # Cache server image used by controller to create cache server pods
  cacheServerImage:
    repository: acstor/dacs-server
    tag: "" # Empty defaults to .Chart.AppVersion (e.g. "local" for dev, build number for published charts)

  # Feature gates to enable (e.g. "UseZeroCopy=true,Foo=false")
  featureGates: ""

  # Extra arguments to pass to the controller
  extraArgs: []

  # Additional environment variables
  env:
    # Stream the initial LIST as a watch to avoid the startup memory spike.
    # Requires apiserver >= 1.32; client-go falls back to LIST otherwise.
    # https://kubernetes.io/docs/reference/using-api/api-concepts/#streaming-lists
    - name: KUBE_FEATURE_WatchListClient
      value: "true"
    # Set the Go runtime memory ceiling so GC sweeps before the cgroup
    # OOM-kills the container. Sourced from the container's memory limit
    # via the downward API.
    - name: GOMEMLIMIT
      valueFrom:
        resourceFieldRef:
          containerName: manager
          resource: limits.memory
          divisor: "1"

  # Pod-level security settings
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
        type: RuntimeDefault

  # Container-level security settings
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
        drop:
            - ALL
    readOnlyRootFilesystem: true

  # Resource limits and requests
  resources:
    limits:
        cpu: 500m
        memory: 512Mi
    requests:
        cpu: 10m
        memory: 64Mi

  # Pod scheduling affinity. Defaults to scheduling only on linux amd64/arm64
  # nodes, and preferring the AKS system nodepool.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                  - linux
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64
                  - arm64
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          preference:
            matchExpressions:
              - key: kubernetes.azure.com/mode
                operator: In
                values:
                  - system

  # Node selector for pod scheduling
  nodeSelector: {}

  # Pod tolerations. Defaults to tolerating the CriticalAddonsOnly taint.
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

  # PriorityClass for the controller pod. Leave empty ("") to use the
  # chart-managed PriorityClass (<fullname>-priority), which the chart creates and
  # protects from preemption/eviction. Set to a specific name to use an existing
  # PriorityClass instead (e.g. system-cluster-critical).
  priorityClassName: ""

# Essential RBAC permissions (required for controller operation)
# These include ServiceAccount, controller permissions, leader election, and metrics access
# Note: Essential RBAC is always enabled as it's required for the controller to function

# Helper RBAC roles for managing custom resources
# These provide convenient admin/editor/viewer roles for each CRD type
# Useful for giving users different levels of access to your custom resources
rbacHelpers:
  enable: false  # Install convenience admin/editor/viewer roles for CRDs

# Custom Resource Definitions
# CRDs are always installed (required for controller to function)
# Set keep=false to remove CRDs on chart uninstall (WARNING: deletes all Cache instances)
crd:
  keep: true    # Keep CRDs when uninstalling

# Controller metrics endpoint.
# Enable to expose /metrics endpoint with RBAC protection.
metrics:
  enable: true
  port: 8443  # Metrics server port

# pprof profiling endpoint. Disabled by default; enable only when debugging.
# See https://book.kubebuilder.io/reference/pprof-tutorial.html for guidance.
# Bound to localhost; reach it via `kubectl port-forward`.
pprof:
  enable: false
  port: 8082

# Admission webhooks for defaulting and validation of Cache CRs.
# When enabled, deploys mutating/validating webhook configurations,
# webhook service, TLS cert secret, and required RBAC.
# The controller's built-in cert-controller manages TLS certificate rotation.
webhook:
  enable: true
  # Failure policy for webhook calls (Fail or Ignore)
  failurePolicy: Fail

# Cert-manager integration for TLS certificates.
# Required for webhook certificates and metrics endpoint certificates.
certManager:
  enable: false

# Prometheus ServiceMonitor for metrics scraping.
# Requires prometheus-operator to be installed in the cluster.
prometheus:
  enable: false


# Pre-delete cleanup job that deletes Cache CRs before chart uninstall.
# Ensures finalizers run and pods are cleaned up gracefully.
cleanup:
  image:
    repository: mcr.microsoft.com/oss/v2/kubernetes/kubectl
    tag: v1.35.6
    pullPolicy: IfNotPresent
  timeoutSeconds: 300
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 32Mi

# Cache Custom Resource configuration
cache:
  enabled: false  # Set to true to deploy a sample Cache instance with the chart 
  name: cache-sample
  namespace: ""  # Namespace for Cache CR (empty = Release.Namespace)
  
  # Scaling configuration (use either static or dynamic, not both).
  # If `dynamic` is set, it takes precedence over the default `static` below,
  # so you can enable dynamic scaling without overriding `static` to null.
  scaling:
    static:
      numServers: 2
    # dynamic:
    #   percentageOfNodesToUse: 50
    #   minServers: 2
    #   maxServers: 10

  # Server configuration
  serverSizeInGB: 4
  serverThreads: 80
  port: 9065
  metricsPort: 9096

  # Resource limits
  # cpuLimit: 4
  # memoryLimitMB: 2048
  # egressBandwidthLimitGbps: 10

  # Node selection
  nodeSelectorKey: "dacs.azure.com/processing-unit"
  nodeSelectorValue: "cpu"

  # Eviction configuration
  eviction:
    enableAccessTimeEviction: true
    evictionMaintainFreeSpace: true
    lastAccessThreshold: "30d"
    passFrequency: "1h"
    sizeTarget: "80"
    sizeThreshold: "90"

  # Storage configuration
  storage:
    ephemeral: false
    hostPath: 
      nodeCacheFolderPath: /var/lib/ssd/cacheserver

  # InfiniBand resource configuration (optional)
  # Set count > 0 to enable IB resources on cache server pods
  infinibandResourceLimitCount: 0
  infinibandResourceLimitName: "rdma/hca_rdma_infiniband"
