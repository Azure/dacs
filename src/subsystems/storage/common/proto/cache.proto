syntax = "proto3";
package cache;
//---------------------------------------------------------------------------------------------------------------------
/** 
 * RPC Mechanism
 *
 * Upload API
 *
 * Client has to first send a 4 byte buffer containing the proto message length, 
 *         then followed by the "Request" proto message with the appropriate UploadRequest fields populated.
 *         The raw file bytes has to be streamed immediately after the proto buffer is sent.
 * The server will respond with a 4 byte buffer containing the proto message length and
 *         then followed by the UploadResponse proto message.
 * Note: The server might fail-fast and not read the entire upload stream for certain errors,
 *       in which case client may not receive proper error codes.
 *       To avoid this we can implement something like HTTP 100 continue semantics,
 *       but may not be optimal in steady state.
 * 
 * Download API
 *
 * Client has to first send a 4 byte buffer containing the proto message length,
 *         then followed by the "Request" proto message with the appropriate DownloadRequest fields populated.
 * The server will respond with a 4 byte buffer containing the proto message length and
 *         then followed by the DownloadResponse proto message. 
 *         If file exists the proto message will be immediately followed by the contents of the file.
 *
 * Delete API
 *
 * Client has to first send a 4 byte buffer containing the proto message length,
 *         then followed by the "Request" proto message with the appropriate DeleteRequest fields populated.
 * The server will respond with a 4 byte buffer containing the proto message length and
 *         then followed by the DeleteResponse proto message. 
 *
 * Infiniband Init API
 *
 * Client has to first send a 4 byte buffer containing the proto message length,
 *         then followed by the "Request" proto message with the appropriate IBInitRequest fields populated.
 * The server will respond with a 4 byte buffer containing the proto message length and
 *         then followed by the IBInitResponse proto message. 
 *
 * GetCacheServers API
 * 
 * Client has to first send a 4 byte buffer containing the proto message length,
 *         then followed by the "Request" proto message with the appropriate GetCacheServers fields populated.
 * The server will respond with a 4 byte buffer containing the proto message length and
 *         then followed by the GetCacheServersResponse proto message.
 *
 */
//---------------------------------------------------------------------------------------------------------------------
// Upload the file contents into the cache
message UploadRequest
{
    string requestid = 999;
    string filename = 1;
    uint64 filesize = 2;

    // If this is set to false then upload will succeed only if a DownloadRequest was 
    //     called prior to this with enablelock set
    bool ignorelock = 3;

    // cache expiry time in seconds, 0 indicates no expiry. If groupid field is also set then this field is ignored (0)
    uint32 expiryseconds = 4;

    // optional arbitrary key,value pairs which will be persisted and returned when the file is downloaded
    map<string, bytes> metadata = 5;

    // Auth support removed; field/name reserved for wire compatibility.
    reserved 6;
    reserved "authparams";

    // optional client managed groupid this key belongs too. Clients need to ensure uniqueness of this id
    bytes groupid = 7;
}
//---------------------------------------------------------------------------------------------------------------------
message UploadResponse
{
    enum Result
    {
        SUCCESS = 0;
        FILE_EXISTS = 1;
        // Auth support removed; value/name reserved for wire compatibility.
        reserved 2;
        reserved "AUTH_FAILED";
        INTERNAL_ERROR = 3;
        BAD_REQUEST = 4;
    }
    Result result = 1;
    string requestid = 2;
}
//---------------------------------------------------------------------------------------------------------------------
// Check and download file from cache
// Use enablelock to coordinate across multiple workers so that only one worker attempts to populate the cache
message DownloadRequest
{
    string requestid = 999;
    string filename = 1;
    uint64 offset = 2;

    // Set length to 0 to fetch entire cached contents 
    uint64 length = 3;
    bool enablelock = 4;

    // Auth support removed; field/name reserved for wire compatibility.
    reserved 5;
    reserved "authparams";
}
//---------------------------------------------------------------------------------------------------------------------
message DownloadResponse
{
    enum Result
    {
        SUCCESS = 0;
        NOT_FOUND_GOT_LOCK = 1;
        NOT_FOUND_ALREADY_LOCKED = 2;
        NOT_FOUND = 3;
        INVALID_OFFSET_LENGTH = 4;
        FILENAME_LIMIT_EXCEEDED = 5;
        // Auth support removed; value/name reserved for wire compatibility.
        reserved 6;
        reserved "AUTH_FAILED";
        INTERNAL_ERROR = 7;
    }
    Result result = 1;
    uint64 filesize = 2;
    map<string, bytes> metadata = 3;
    bool isFullDownload = 4;
    string requestid = 5;
}
//---------------------------------------------------------------------------------------------------------------------
// Delete file entry from cache
message DeleteRequest
{
    string requestid = 999;
    oneof type
    {
        // TODO: Not yet supported
        string filename = 1;

        // if groupid is selected, all files belonging to the group will be deleted
        bytes groupid = 2;

        // if lastaccesstime is selected, all files older than lastaccesstime will be deleted
        bytes lastaccesstime = 4; 
    }

    // Auth support removed; field/name reserved for wire compatibility.
    reserved 3;
    reserved "authparams";
}
//---------------------------------------------------------------------------------------------------------------------
message DeleteResponse
{
    enum Result
    {
        SUCCESS = 0;
        // Auth support removed; value/name reserved for wire compatibility.
        reserved 1;
        reserved "AUTH_FAILED";
        INTERNAL_ERROR = 2;
    }
    Result result = 1;
    string requestid = 2;
}
//---------------------------------------------------------------------------------------------------------------------
message IBInitRequest
{

    string requestid = 999;

    // Unique IB device identifier within the infiniband fabric
    uint32 clientlid = 1;

    // Unique port which is used within the device
    uint32 clientibport = 2;

    // client packet mtu, needed to synchronize client and server mtu in case they are different
    uint32 clientmtu = 3;

    // The client created qp identifiers to establish one-one connections with server
    repeated uint32 clientqpn = 4;

    // Auth support removed; field/name reserved for wire compatibility.
    reserved 5;
    reserved "authparams";
}
//---------------------------------------------------------------------------------------------------------------------
message IBInitResponse
{
    enum Result
    {
        SUCCESS = 0;
        // Auth support removed; value/name reserved for wire compatibility.
        reserved 1;
        reserved "AUTH_FAILED";
        IB_NOT_SUPPORTED = 2;
        INTERNAL_ERROR = 3;
    }
    Result result = 1;

    // Unique server IB identifier
    uint32 serverlid = 2;

    // ib port of the server being used
    uint32 serveribport = 3;

    // Server supported packet mtu size
    uint32 servermtu = 4;

    // The server created qp identifiers which is connected to the client qps in the order it was sent in the request
    repeated uint32 serverqpn = 5;
    string requestid = 6;
}
//----------------------------------------------------------------------------------------------------------------------
message GetCacheLastAccessTimeDistributionRequest
{
    string requestid = 999;
    uint64 distributionbucketsizeinhours = 1;

    // Auth support removed; field/name reserved for wire compatibility.
    reserved 2;
    reserved "authparams";
}
//-----------------------------------------------------------------------------------------------------------------------
message GetCacheLastAccessTimeDistributionResponse
{
    enum Result
    {
        SUCCESS = 0;
        // Auth support removed; value/name reserved for wire compatibility.
        reserved 1;
        reserved "AUTH_FAILED";
        INTERNAL_ERROR = 2;
    }
    Result result = 1;
    map<int64, uint64> distributionmap = 2;
    string requestid = 3;
}
//----------------------------------------------------------------------------------------------------------------------
message GetCacheServersRequest
{
    string requestid = 999;
}
//-----------------------------------------------------------------------------------------------------------------------
message GetCacheServersResponse
{
    enum Result
    {
        SUCCESS = 0;
        INTERNAL_ERROR = 1;
    }
    Result result = 1;

    // List of cache server addresses
    repeated string serveraddresses = 2;
    string requestid = 3;
}
//---------------------------------------------------------------------------------------------------------------------
message EndMarker
{

}
//---------------------------------------------------------------------------------------------------------------------
// Locator Cache RPC messages for TachyonKV
//---------------------------------------------------------------------------------------------------------------------
message LocatorContentReplica
{
    uint32 nodeId = 1;
    uint64 expiresAt = 2;       // Epoch ms
    uint64 lastRefreshed = 3;   // Epoch ms
    uint64 contentSize = 4;     // Logical size of stored value in bytes (0 = unknown)

    // Tier this replica lives in. Additive for rolling upgrades: old nodes ignore it and it
    // defaults to 0 (Cache), so existing cache-tier registrations are unchanged.
    //   0 = Cache - warm copy on a cache node (nodeId + short TTL in expiresAt).
    //   1 = Blob - durable copy in Azure Blob (nodeId unused; expiresAt is a conservative
    //               soft-TTL; the location is derived from the key, not stored here).
    uint32 tier = 5;
}
//---------------------------------------------------------------------------------------------------------------------
message LocatorRegisterRequest
{
    string key = 1;
    LocatorContentReplica replica = 2;
    string requestId = 3;
    string parentHash = 4;   // prefix_hash of the parent block (0 for root); enables prefix-tree bookkeeping
    string rootHash = 5;     // prefix_hash of the chain's root block (0 for root)
}

message LocatorRegisterResponse
{
    enum Result
    {
        SUCCESS = 0;
        INTERNAL_ERROR = 1;
    }
    Result result = 1;
    string requestId = 2;   // Echoed on every response, including errors.
}
//---------------------------------------------------------------------------------------------------------------------
message LocatorLookupRequest
{
    string key = 1;
    string requestId = 2;
}

message LocatorLookupResponse
{
    enum Result
    {
        SUCCESS = 0;
        NOT_FOUND = 1;
        INTERNAL_ERROR = 2;
    }
    Result result = 1;
    repeated LocatorContentReplica replicas = 2;
    string requestId = 3;
}
//---------------------------------------------------------------------------------------------------------------------
message LocatorRefreshRequest
{
    string key = 1;
    uint32 nodeId = 2;
    uint64 newExpiresAt = 3;    // Epoch ms
    string requestId = 4;
}

message LocatorRefreshResponse
{
    enum Result
    {
        SUCCESS = 0;
        NOT_FOUND = 1;
        INTERNAL_ERROR = 2;
    }
    Result result = 1;
    string requestId = 2;
}
//---------------------------------------------------------------------------------------------------------------------
message LocatorUnregisterRequest
{
    string key = 1;
    uint32 nodeId = 2;
    string requestId = 3;
}

message LocatorUnregisterResponse
{
    enum Result
    {
        SUCCESS = 0;
        NOT_FOUND = 1;
        INTERNAL_ERROR = 2;
    }
    Result result = 1;
    string requestId = 2;
}
//---------------------------------------------------------------------------------------------------------------------
message LocatorPrefixLookupRequest
{
    repeated string keys = 1;      // storage_key() for each block in chain order
    string requestId = 2;
    string baseParentHash = 3;     // storage_key of the parent of keys[0] ("" when the chain roots here)
}

message LocatorPrefixLookupResponse
{
    enum Result
    {
        SUCCESS = 0;
        INTERNAL_ERROR = 1;
    }
    Result result = 1;

    // matched contains only blocks with a live replica; matched_count truncates at the
    // first block that is missing or expired. matched[i] corresponds to keys[i].
    uint32 matched_count = 2;
    repeated LocatorPrefixEntry matched = 3;   // one entry per matched block, in chain order
    string requestId = 4;
}
//---------------------------------------------------------------------------------------------------------------------
// A single resolved block in a prefix-lookup response.
//
// NOTE: Each entry conveys a single node replica (the server's chosen live replica). If clients
// should choose among replicas (locality-aware selection, failover/retries), change node_replica
// to a repeated field (or add a repeated replicas field) so the full live-replica set reaches
// the client instead of being collapsed to one node server-side.
message LocatorPrefixEntry
{
    uint64 content_size = 1;   // logical size of the stored value in bytes (0 = unknown), common to all location kinds

    oneof location
    {
        LocatorNodeReplica node_replica = 2;   // resident in an in-memory cache-server node
        LocatorBlobReference blob_ref = 3;     // future: durable/blob-tier location
    }
}
//---------------------------------------------------------------------------------------------------------------------
message LocatorNodeReplica
{
    uint32 node_id = 1;      // node_id of the best live replica
}
//---------------------------------------------------------------------------------------------------------------------
// NOTE: If the container/blob name can be derived deterministically from the block key (rather
// than stored per entry), blob_path could collapse to a bool "present in blob tier" flag - the
// client would reconstruct the location itself, cutting the per-entry string and its allocation.
message LocatorBlobReference
{
    string blob_path = 1;    // durable/blob-tier location (URI or container+blob-name)
}
//---------------------------------------------------------------------------------------------------------------------
// Batch chain registration - registers all blocks in a chain with a single RPC.
message LocatorRegisterChainEntry
{
    string key = 1;
    LocatorContentReplica replica = 2;
    string parentHash = 3;
    string rootHash = 4;
}

message LocatorRegisterChainRequest
{
    repeated LocatorRegisterChainEntry entries = 1;
    string requestId = 2;
}

message LocatorRegisterChainResponse
{
    enum Result
    {
        SUCCESS = 0;
        INTERNAL_ERROR = 1;
    }
    Result result = 1;
    string requestId = 2;
}
//---------------------------------------------------------------------------------------------------------------------
message Request
{
    reserved 1, 4, 5, 10;
    reserved "lockrequest", "getattributerequest", "putattributerequest";
    oneof type
    {
        UploadRequest uploadrequest = 2;
        DownloadRequest downloadrequest = 3;
        DeleteRequest deleterequest = 6;
        IBInitRequest ibinitrequest = 7;
        GetCacheLastAccessTimeDistributionRequest getcachelastaccesstimedistributionrequest = 8;
        GetCacheServersRequest getcacheserversrequest = 9;
        LocatorRegisterRequest locatorregisterrequest = 11;
        LocatorLookupRequest locatorlookuprequest = 12;
        LocatorRefreshRequest locatorrefreshrequest = 13;
        LocatorUnregisterRequest locatorunregisterrequest = 14;
        LocatorPrefixLookupRequest locatorprefixlookuprequest = 15;
        LocatorRegisterChainRequest locatorregisterchainrequest = 16;
        EndMarker endmarker = 17;
    }
}
//---------------------------------------------------------------------------------------------------------------------