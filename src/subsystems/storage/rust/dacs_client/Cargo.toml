[package]
name = "dacs-rust-client"
version = "0.9.0"
edition = "2021"
description = "Rust client for the DACS storage-intercept layer"
license = "Apache-2.0"
publish = false

# The prebuilt native library (libStorageDirect.so) and any rpath-repaired
# dependencies are staged under native/<target>/ by the publish pipeline and
# embedded via include_bytes! (see build.rs / src/loader.rs).
include = [
    "src/**",
    "build.rs",
    "tests/**",
    "native/**",
    "README.md",
    "LICENSE",
    "NOTICE.txt",
]

[lib]
name = "dacs_client"
path = "src/lib.rs"

[dependencies]
libloading = "0.8"
libc = "0.2"
