# Upload data to cache server. Use with stress_tests/batch_job_runner.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: uploadclient
spec:
  manualSelector: true
  selector:
    matchLabels:
      app: uploadclient
  parallelism: 1
  template:
    metadata:
      labels:
        app: uploadclient
    spec:
      # imagePullSecrets:
      # - name: dacs-regcred
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: dacs.azure.com/processing-unit
                operator: In
                values:
                - gpu
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100 # The higher the weight, the stronger the preference
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app # Label to use for anti-affinity
                  operator: In
                  values:
                  - uploadclient
              topologyKey: kubernetes.io/hostname # Use the node's hostname for anti-affinity
      containers:
      - name: job
        image:  dacs.azurecr.io/test-image:1.5.9
        command: ['/app/PerfClient']
        args: ['--server-port', '9065', '--server-hostname', 'cacheserver-0.cacheserver.azureml.svc.cluster.local', '--num-threads', '64', '--data-size-GiB', '1000', '--prefix', 'test8', '--mode', 'upload', '--num-iterations', '1', '--ib-enabled', 'true']
        resources:
         limits:
           rdma/hca_rdma_infiniband: 1

      restartPolicy: Never