apiVersion: v1
kind: Service
metadata:
 name: cacheserver
 labels:
   app: cacheserver
spec:
  ports:
  - name: cacheserver
    port: 9065
  clusterIP: None
  selector:
    app: cacheserver
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cacheserver
spec:
  selector:
    matchLabels:
      app: cacheserver
  serviceName: cacheserver
  replicas: 1
  template:
    metadata:
      labels:
        app: cacheserver
    spec:
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
      - name: regcreddacsdaily
      containers:
      - name: cacheserver
        image: dacs.azurecr.io/dacs/cache-server:0.0.5167
        ports:
        - containerPort: 9065
        env:
        - name: CACHESERVER_THREADPOOL_SIZE
          value: "64"
        - name: TEST_CACHESERVER_ADDR_PORT
          value: "9065"
        - name: CACHESERVER_METRICS_PORT
          value: "9066"
        - name: CACHESERVER_EVICTION_ENABLED
          value: "true"
        command: ['/bin/sh', '-c', 'CACHESERVER_HOSTNAME=$HOSTNAME /root/CacheServer 9065 /mnt/local 1825361100800']
        volumeMounts:
          - name: persistent-storage
            mountPath: /mnt/local
  volumeClaimTemplates:
    - metadata:
        name: persistent-storage
        annotations:
          volume.beta.kubernetes.io/storage-class: local-disk
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1700Gi
