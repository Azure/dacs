[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools", "wheel" ]

[project]
name = "dacs_cache_PLACEHOLDER"
description = "Python package for DACS Client"
readme = "README.md"
license-files = [ "LICENSES/*" ]
authors = [ { name = "Microsoft Corporation", email = "dacs-storage@users.noreply.github.com" } ]
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering"
]
dynamic = [ "version" ]
# Runtime dependencies of the wheel. Keep this list to packages that
# py_dacs_client.__init__ (or any module reachable from it without an
# explicit opt-in import) needs at import time, OR that the bundled native
# library expects to find in the environment for authentication.
#
# azure-identity is listed because the native libStorageDirect.so expects an
# azure-identity-compatible credential chain in the environment. The Python
# package itself does not import it, but installing it by default matches the
# behavior consumers have relied on historically.
#
# blobfile is intentionally NOT a hard dep: it is only required if the user
# opts into the blobfile monkey-patch via
# `from py_dacs_client.dacs_blobfile_patcher import enable_dacs_backend`.
# Install with `pip install dacs_cache[blobfile]` to enable that path.
dependencies = [
  "azure-identity>=1.12",
]
optional-dependencies.blobfile = [ "blobfile" ]
optional-dependencies.test = [
  "azure-storage-blob",
  "blobfile",
  "pytest",
  "pytest-asyncio",
  "pytest-timeout",
]
[tool.setuptools]
dynamic.version = { attr = "py_dacs_client.__version__" }
package-data.py_dacs_client = [ "libStorageDirect.so" ]
packages.find.where = [ "." ]
packages.find.include = [ "py_dacs_client*" ]
packages.find.exclude = [ "*test*", "*tests*", "*benchmark*", "*benchmarks*" ]

[tool.pytest]
ini_options.minversion = "6.0"
ini_options.addopts = "-ra -q"
ini_options.testpaths = [
  "tests",
]
