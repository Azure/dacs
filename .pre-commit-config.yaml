# Pre-commit hooks for DACS. Run locally with `pre-commit run --all-files`; the
# same set is enforced in CI by .github/workflows/lint.yml. Hook versions are
# pinned by commit SHA (tag in a trailing comment) for reproducible, auditable
# runs.
repos:
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: cef8b8350da46d8114c7e6b7272aebdccdf193ce # v1.30.0
    hooks:
      - id: zizmor
        args:
          - --no-progress
          - --persona=auditor
