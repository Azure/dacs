name: Upload component image
description: >-
  Uploads the Docker archive produced directly by BuildKit as the
  dacs-image-<name>-<arch> artifact consumed by test and scan jobs.

inputs:
  name:
    description: >-
      Component image name used to locate dacs-image-<name>.tar and form the
      dacs-image-<name>-<arch> artifact name.
    required: true
  arch:
    description: Target architecture suffix for the artifact name (e.g. amd64).
    required: true

runs:
  using: composite
  steps:
    - name: Upload ${{ inputs.name }} image
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dacs-image-${{ inputs.name }}-${{ inputs.arch }}
        path: ${{ runner.temp }}/dacs-image-${{ inputs.name }}.tar
        retention-days: 1
        if-no-files-found: error
        compression-level: 0
