name: Restore build tree
description: >-
  Restores the compiled build outputs produced by the build job so a downstream
  job can reuse them without recompiling: optionally downloads and loads the
  native-build toolchain image the compile job published, then downloads and
  unpacks the build-tree artifact (bin/ plus the ctest metadata from build/).
  Keeps the per-job setup steps in one place
  (step-level reuse via a composite action) instead of duplicating them.

inputs:
  artifact:
    description: Name of the build-tree artifact to download and unpack.
    required: false
    default: dacs-build-tree
  native-build-image-artifact:
    description: >-
      Name of the native-build toolchain image artifact (docker save tarball)
      the compile job published, to docker load when restore-native-build-image
      is 'true'. Callers pass the arch-suffixed name
      (e.g. dacs-native-build-image-amd64).
    required: false
    default: dacs-native-build-image
  restore-native-build-image:
    description: >-
      Whether to restore the native-build toolchain image published by the
      compile job. Needed by jobs that run make targets in-container (test,
      pytest, python-package); set to 'false' for jobs that only need the
      binaries (e.g. building component images).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Load the exact toolchain image the compile job built (docker save ->
    # artifact -> docker load), rather than reconstructing it from the layer
    # cache. docker load restores the image with its original
    # dacs.azurecr.io/native-build:linux-<arch> tag, which is what bldenv.sh
    # looks up, so the in-container make targets reuse it directly. Tests run
    # inside this container via bldenv.sh (USE_CONTAINER=1), matching how the
    # binaries were compiled.
    - name: Download native-build image
      if: inputs.restore-native-build-image == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.native-build-image-artifact }}
        path: /tmp

    - name: Load native-build image into Docker
      if: inputs.restore-native-build-image == 'true'
      shell: bash
      env:
        NATIVE_BUILD_IMAGE_ARTIFACT: ${{ inputs.native-build-image-artifact }}
      run: docker load -i "/tmp/${NATIVE_BUILD_IMAGE_ARTIFACT}.tar"

    - name: Download build tree
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact }}
        path: /tmp

    # Restore build/ and bin/ in place (tar preserves the executable bit).
    - name: Unpack build tree
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact }}
      run: tar -xf "/tmp/${ARTIFACT}.tar"
