name: CI

# Entry-point CI workflow. Runs on every push to main and on pull requests
# (including from forks). Because it is a `pull_request` workflow - not
# `workflow_run` - the PR's own copy of this file runs, so CI changes can be
# iterated in the PR itself, and fork PRs get a read-only token with no secrets.
#
# It calls the reusable build workflow once, then fans out in parallel the
# credential-free jobs that consume its artifacts (each `needs: build`, reusing
# the build's artifacts via same-run download - no run-id or token needed). This
# mirrors the ADO pipeline, where Build runs first and the downstream stages run
# in parallel afterwards.
#
# Only credential-free legs run here - each `needs: build` job below is
# documented by its own comment, and those job definitions are the source of
# truth for what actually runs (a given release cut may disable some of them via
# the OSS release tooling). Legs that need real Azure blob credentials (the
# storage-intercept integration tests) or special hardware (the InfiniBand e2e)
# stay on the private tier.

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release-**]

permissions: {}

jobs:
  # Build once per architecture. Artifacts (dacs-image-<name>-<arch>,
  # dacs-build-tree-<arch>, dacs-wheel-<arch>) land in this run and are
  # downloadable by the test jobs below. The matrix is arch-suffixed end to end,
  # so enabling arm64 is just uncommenting the matrix entries here and in the
  # test jobs - nothing else needs to change.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          # - arch: arm64
          #   runner: ubuntu-24.04-arm
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      build_type: Release
      build_arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}

  # Vulnerability-scan the container images the build produced. Fans out into
  # one parallel job per component image (matrix) so the Trivy step is written
  # once instead of copy-pasted per image. Each job downloads only its own
  # per-image dacs-image-<name>-<arch> artifact (docker load) instead of
  # rebuilding it. fail-fast is off so one image's CVEs do not hide the others;
  # any fixable CRITICAL/HIGH fails that image's job.
  image-scan:
    name: Image vulnerability scan (${{ matrix.image }}, ${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One scan job per component image. To add an image, add its name here
        # (must match the docker tag / dacs-image-<name> artifact from build).
        image:
          - cache-server
          - cache-test-client
          - cacheserver-scheduler
          - cache-controller
        arch: [amd64]
        # arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          # - arch: arm64
          #   runner: ubuntu-24.04-arm
    steps:
      - name: Download component image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dacs-image-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp

      - name: Load image into Docker
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: docker load -i "/tmp/dacs-image-${IMAGE_NAME}.tar"

      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        env:
          TRIVY_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-db:2"
        with:
          image-ref: '${{ matrix.image }}:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # CPU unit tests: native C++ (ctest) + Go. Reuses the compiled build tree and
  # restores the native-build toolchain image from the gha cache populated by
  # the build job, so no source is recompiled (ctest just runs the prebuilt
  # binaries).
  unit-test:
    name: CPU unit tests (native + Go, ${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          # - arch: arm64
          #   runner: ubuntu-24.04-arm
    env:
      BUILD_TYPE: Release
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      # Temporarily disabled (step-security): harden-runner does not work under
      # local `act` runs and its egress monitoring is unnecessary there.
      # - name: Harden Runner
      #   uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      #   with:
      #     egress-policy: audit

      - name: Check out the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Loads the native-build toolchain image the compile job published and
      # unpacks the build tree. ctest runs inside that container via bldenv.sh
      # (USE_CONTAINER=1), matching how the binaries were compiled.
      - name: Restore build tree
        uses: ./.github/actions/restore-build
        with:
          artifact: dacs-build-tree-${{ matrix.arch }}
          native-build-image-artifact: dacs-native-build-image-${{ matrix.arch }}

      - name: Run unit tests (native + Go)
        run: make test
