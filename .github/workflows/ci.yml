name: CI

# Entry-point CI workflow. Runs on every push to main and on pull requests
# (including from forks). Because it is a `pull_request` workflow - not
# `workflow_run` - the PR's own copy of this file runs, so CI changes can be
# iterated in the PR itself, and fork PRs get a read-only token with no secrets.
#
# It calls the reusable build workflow once, then fans out in parallel the
# credential-free jobs that consume its artifacts (each `needs: build`, reusing
# the build's artifacts via same-run download - no run-id or token needed). This
# mirrors the ADO pipeline, where Build runs first and the downstream stages run
# in parallel afterwards.
#
# Only credential-free legs run here - each `needs: build` job below is
# documented by its own comment, and those job definitions are the source of
# truth for what actually runs (a given release cut may disable some of them via
# the OSS release tooling). Legs that need real Azure blob credentials (the
# storage-intercept integration tests) or special hardware (the InfiniBand e2e)
# stay on the private tier.

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    # Documentation-only changes are covered by the separate lint and security
    # workflows and do not need the full build and test matrix.
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main, release-**]
    paths-ignore:
      - '**/*.md'

permissions: {}

jobs:
  # Build once per architecture. Artifacts (dacs-image-<name>-<arch>,
  # dacs-build-tree-<arch>, dacs-wheel-<arch>) land in this run and are
  # downloadable by the test jobs below. The matrix is arch-suffixed end to end,
  # so enabling arm64 is just uncommenting the matrix entries here and in the
  # test jobs - nothing else needs to change.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    uses: $/.github/workflows/build.yml
    with:
      build_type: Release
      build_arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}

  # Vulnerability-scan the container images the build produced. Fans out into
  # one parallel job per component image (matrix) so the Trivy step is written
  # once instead of copy-pasted per image. Each job downloads only its own
  # per-image dacs-image-<name>-<arch> artifact (docker load) instead of
  # rebuilding it. fail-fast is off so one image's CVEs do not hide the others.
  # This scan is report-only (exit-code 0): findings are uploaded as code-scanning
  # alerts to triage over time and never fail the build. New vulnerable
  # dependencies a PR adds are gated separately by the Dependency Review workflow.
  image-scan:
    name: Image vulnerability scan (${{ matrix.image }}, ${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # upload Trivy image SARIF to the code-scanning / Security tab
      actions: read  # upload-sarif reads workflow run metadata for the scan
    strategy:
      fail-fast: false
      matrix:
        # One scan job per component image. To add an image, add its name here
        # (must match the docker tag / dacs-image-<name> artifact from build).
        image:
          - cache-server
          - cache-test-client
          - cacheserver-scheduler
          - cache-controller
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Download component image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dacs-image-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp

      - name: Load image into Docker
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: docker load -i "/tmp/dacs-image-${IMAGE_NAME}.tar"

      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: '${{ matrix.image }}:local'
          format: 'sarif'
          output: 'trivy-${{ matrix.image }}-${{ matrix.arch }}.sarif'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload ${{ matrix.image }} scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: 'trivy-${{ matrix.image }}-${{ matrix.arch }}.sarif'
          # Distinct category per image/arch so each matrix leg's alerts are
          # tracked independently instead of overwriting one another.
          category: 'trivy-image-${{ matrix.image }}-${{ matrix.arch }}'

  # CPU unit tests: native C++ (ctest), Go, and Rust. Reuses the compiled build
  # tree and restores the native-build toolchain image from the gha cache
  # populated by the build job, so no source is recompiled (ctest just runs the
  # prebuilt binaries).
  unit-test:
    name: CPU unit tests (native + Go + Rust, ${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      BUILD_TYPE: Release
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Loads the native-build toolchain image the compile job published and
      # unpacks the build tree. ctest runs inside that container via bldenv.sh
      # (USE_CONTAINER=1), matching how the binaries were compiled.
      - name: Restore build tree
        uses: $/.github/actions/restore-build
        with:
          artifact: dacs-build-tree-${{ matrix.arch }}
          native-build-image-artifact: dacs-native-build-image-${{ matrix.arch }}

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/.cache/dacs-cargo
            src/subsystems/storage/rust/dacs_client/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/subsystems/storage/rust/dacs_client/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Run unit tests (native + Go + Rust)
        run: make test

  # Run the existing controller and 1 GiB performance suites against the images
  # produced by the build job. Three Minikube nodes are the minimum needed by
  # the current multi-cache tests, which schedule three cache-server pods on
  # unique nodes.
  integration-test:
    name: Controller and perf E2E tests (Minikube, ${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      MINIKUBE_VERSION: v1.38.1
    steps:
      # Harden Runner Community breaks Minikube Docker networking because it
      # cannot resolve host.docker.internal. See step-security/harden-runner#418.

      - name: Free disk space for Minikube
        run: |
          echo "Disk space before cleanup:"
          df -h /

          sudo rm -rf -- \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /usr/share/dotnet \
            /usr/share/swift

          echo "Disk space after cleanup:"
          df -h /

      - name: Check out the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: test/go.mod
          cache-dependency-path: |
            test/go.sum
            src/subsystems/cache-controller/go.sum

      - name: Download cache-controller image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dacs-image-cache-controller-${{ matrix.arch }}
          path: /tmp/dacs-images/cache-controller

      - name: Download cache-server image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dacs-image-cache-server-${{ matrix.arch }}
          path: /tmp/dacs-images/cache-server

      - name: Download cache-test-client image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dacs-image-cache-test-client-${{ matrix.arch }}
          path: /tmp/dacs-images/cache-test-client

      - name: Configure Minikube environment
        run: echo "MINIKUBE_HOME=${RUNNER_TEMP}/minikube" >> "$GITHUB_ENV"

      - name: Install Minikube
        env:
          MINIKUBE_ARCH: ${{ matrix.arch }}
        run: |
          curl --fail --location --retry 5 --retry-delay 5 \
            --output minikube \
            "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-${MINIKUBE_ARCH}"
          curl --fail --location --retry 5 --retry-delay 5 \
            --output minikube.sha256 \
            "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-${MINIKUBE_ARCH}.sha256"
          echo "$(cat minikube.sha256)  minikube" | sha256sum --check
          sudo install minikube /usr/local/bin/minikube
          sudo mkdir -p "$MINIKUBE_HOME"
          sudo chown -R "$(id -u):$(id -g)" "$MINIKUBE_HOME"
          minikube version

      - name: Create Minikube cluster
        run: |
          sed -i \
            -e 's/^MINIKUBE_NODES=.*/MINIKUBE_NODES=4/' \
            .pipelines/scripts/k8s/config/local.config
          make provision TARGET=minikube

      - name: Load images into Minikube
        run: |
          mapfile -d '' image_archives \
            < <(find /tmp/dacs-images -name '*.tar' -print0)
          if [ "${#image_archives[@]}" -ne 3 ]; then
            echo "Expected 3 image archives, found ${#image_archives[@]}" >&2
            exit 1
          fi

          for image_archive in "${image_archives[@]}"; do
            minikube image load "$image_archive"
            rm -- "$image_archive"
          done

      - name: Deploy DACS
        run: |
          make deploy CONTROLLER=new \
            HELM_ARGS="--set manager.cacheServerImage.repository=cache-server --set manager.cacheServerImage.tag=local"

      - name: Run controller and perf E2E tests
        run: >-
          make test-e2e
          TEST_FILTER='(perf || controller) && !small-chunk'
          TEST_TIMEOUT=60m
          EXTRA_TEST_ARGS='--data-size-gib=1'

      - name: Collect failure diagnostics
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p support-bundles/ci
          kubectl get pods --all-namespaces -o wide \
            > support-bundles/ci/pods.txt 2>&1 ||
            echo "Failed to collect pods" >> support-bundles/ci/pods.txt
          kubectl get events --all-namespaces \
            --sort-by='.metadata.creationTimestamp' \
            > support-bundles/ci/events.txt 2>&1 ||
            echo "Failed to collect events" >> support-bundles/ci/events.txt
          kubectl describe pods --all-namespaces \
            > support-bundles/ci/pod-descriptions.txt 2>&1 ||
            echo "Failed to describe pods" >> support-bundles/ci/pod-descriptions.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controller-perf-e2e-results-${{ matrix.arch }}
          path: |
            test.xml
            summary.md
            support-bundles/
          if-no-files-found: warn
          retention-days: 7

      - name: Clean up Minikube
        if: always()
        continue-on-error: true
        run: |
          status=0
          make undeploy || status=$?
          ./deploy/scripts/minikube/clean.sh || status=$?
          exit "$status"
