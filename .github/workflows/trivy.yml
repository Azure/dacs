name: Trivy dependency and config scan

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release-**]

permissions: {}

jobs:
  scan:
    name: Filesystem scan (dependencies and misconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # upload Trivy SARIF to the code-scanning / Security tab
      actions: read  # upload-sarif reads workflow run metadata for the scan
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Scans the source tree for vulnerable dependencies (go.sum, requirements,
      # etc.) and Dockerfile/IaC misconfigurations, then uploads the results as
      # code-scanning alerts. This scan is report-only (exit-code 0): it surfaces
      # the full backlog to fix over time without failing the build. New vulnerable
      # dependencies introduced by a PR are gated separately by the Dependency
      # Review workflow, which fails only on deps the PR actually adds.
      - name: Run Trivy filesystem scan (dependencies and misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: 'trivy-results.sarif'

      # Keep the SARIF scan report-only so its upload always runs, then enforce
      # the release policy separately against fixable critical vulnerabilities.
      - name: Block fixable critical dependency vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
