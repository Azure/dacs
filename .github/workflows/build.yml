name: Build

# Reusable build workflow (workflow_call). Compiles the native (C++), Go, and
# Rust code and packages the component images, Python wheel, and Rust crate.
# The image builds are split per image so they run on separate runners:
#
#   compile --+--> images-cpp (matrix: cache-server, cache-test-client)
#             +--> packages (Python wheel and Rust crate)
#   wheel-focal (Ubuntu 20.04 Python wheel only)
#   images-go (matrix: scheduler, controller)   # no needs: runs alongside compile
#
# The two Go images compile Go from source inside their own Dockerfiles and do
# not need the C++ build tree, so images-go has no `needs` and builds
# concurrently with compile. Each image job uploads its own
# dacs-image-<name>-<arch> tarball; the C++ images additionally reuse the
# compiled build tree that compile publishes as dacs-build-tree-<arch> (so the
# caller's test jobs can also run the prebuilt binaries without recompiling).
# Callers (ci.yml today; a release/nightly pipeline later) invoke this via
# `uses: $/.github/workflows/build.yml`.
on:
  workflow_call:
    inputs:
      build_type:
        description: CMake build type (Debug/Release).
        type: string
        default: Debug
      build_arch:
        description: Target architecture (amd64/arm64). Must match the runner arch.
        type: string
        default: amd64
      runner:
        description: >-
          Runner label to compile/package on. Keep in sync with build_arch -
          use ubuntu-latest for amd64 and an arm64 runner label (e.g.
          ubuntu-24.04-arm) for arm64.
        type: string
        default: ubuntu-latest
permissions: {}

jobs:
  wheel-focal:
    name: Python wheel (Ubuntu 20.04)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      BUILD_ARCH: ${{ inputs.build_arch }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build Ubuntu 20.04 wheel container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/images/native-build
          file: src/images/native-build-wheel-focal/Dockerfile
          tags: dacs-wheel-focal:local
          load: true
          cache-from: >-
            ${{ !startsWith(github.ref, 'refs/tags/') &&
            format('type=gha,scope=wheel-focal-{0}', inputs.build_arch) || '' }}
          cache-to: >-
            ${{ !startsWith(github.ref, 'refs/tags/') &&
            format('type=gha,scope=wheel-focal-{0},mode=min', inputs.build_arch) || '' }}

      - name: Build native library and wheel
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace -e BUILD_ARCH \
            dacs-wheel-focal:local bash -euo pipefail -c '
              export CMAKE_BINARY_DIR="$PWD/build/focal/$BUILD_ARCH"
              export CMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/bin/Release/$BUILD_ARCH/native"
              export CMAKE_RUNTIME_OUTPUT_DIRECTORY="$CMAKE_LIBRARY_OUTPUT_DIRECTORY"
              export CMAKE_REMOTE_PUBLISH_DIRECTORY="$CMAKE_LIBRARY_OUTPUT_DIRECTORY"
              cmake -S . -B "$CMAKE_BINARY_DIR" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DDISABLE_AMQP=ON \
                -DGIT_COMMIT_HASH="$(git rev-parse HEAD)"
              cmake --build "$CMAKE_BINARY_DIR" --target StorageDirect --parallel 4
              AUDITWHEEL_PLAT="manylinux_2_31_$(uname -m)" \
                bash .pipelines/scripts/build/build-python-package.sh
            '

      - name: Upload Ubuntu 20.04 wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dacs-wheel-focal-${{ inputs.build_arch }}
          path: src/subsystems/storage/dacs_client/dist/*.whl
          if-no-files-found: error

  # Compile once. Publishes the build tree so images, packages, and the
  # caller's test jobs can all reuse it. Builds and gha-caches the native-build
  # toolchain image so downstream jobs restore it cheaply.
  compile:
    name: Compile (C++ and Go)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      BUILD_TYPE: ${{ inputs.build_type }}
      BUILD_ARCH: ${{ inputs.build_arch }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: >-
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.build_type }}-
            ${{ hashFiles('src/images/native-build/Dockerfile', 'toolchain.cmake') }}-
            ${{ github.sha }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.build_type }}-${{ hashFiles('src/images/native-build/Dockerfile', 'toolchain.cmake') }}-
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.build_type }}-
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/dacs-cargo
            src/subsystems/storage/rust/dacs_client/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/subsystems/storage/rust/dacs_client/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}

      # Build the native toolchain image from the repo so we never depend on the
      # private ACR. The tag matches what bldenv.sh looks up (derived from the
      # runner arch, so this is correct on amd64 and arm64 runners alike), so
      # `make build` reuses this locally loaded image instead of trying to pull
      # it. BuildKit writes the Docker archive directly so downstream jobs can
      # load the exact same image without a separate docker save export.
      - name: Resolve native-build image tag
        id: image
        run: |
          arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          echo "tag=dacstest.azurecr.io/dacs/native-build:linux-${arch}" >> "$GITHUB_OUTPUT"

      - name: Build and export native-build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/images/native-build
          file: src/images/native-build/Dockerfile
          tags: ${{ steps.image.outputs.tag }}
          push: false  # build locally only; never pushed to a registry
          cache-from: >-
            ${{ !startsWith(github.ref, 'refs/tags/') &&
            format('type=gha,scope=native-build-{0}', inputs.build_arch) || '' }}
          cache-to: >-
            ${{ !startsWith(github.ref, 'refs/tags/') &&
            format('type=gha,scope=native-build-{0},mode=min', inputs.build_arch) || '' }}
          outputs: type=docker,dest=/tmp/dacs-native-build-image-${{ inputs.build_arch }}.tar

      - name: Load native-build image
        run: docker load -i "/tmp/dacs-native-build-image-${BUILD_ARCH}.tar"

      - name: Upload native-build image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dacs-native-build-image-${{ inputs.build_arch }}
          path: /tmp/dacs-native-build-image-${{ inputs.build_arch }}.tar
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

      - name: Build
        run: make build

      # Pack the compiled binaries (bin/) plus only the ctest metadata from the
      # CMake build tree (the CTestTestfile.cmake files, which point at the bin/
      # binaries) so the downstream jobs can run the prebuilt binaries without
      # recompiling - this mirrors the ADO pipeline, which publishes bin/ + build/
      # and every test stage downloads them. We deliberately exclude the ~490MB of
      # object files and static libs in build/ (compile intermediates no test,
      # image or wheel job consumes), roughly halving the artifact. We tar (rather
      # than upload the dirs directly) to preserve the executable bit on the
      # compiled binaries, which actions/upload-artifact would otherwise drop.
      - name: Pack build tree
        run: |
          mapfile -d '' -t ctest_files < <(
            find build -name 'CTestTestfile.cmake' -print0
          )
          tar -cf "/tmp/dacs-build-tree-${BUILD_ARCH}.tar" \
            bin "${ctest_files[@]}"

      - name: Upload build tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dacs-build-tree-${{ inputs.build_arch }}
          path: /tmp/dacs-build-tree-${{ inputs.build_arch }}.tar
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  # Build the two Go component images (scheduler, controller). They compile Go
  # from source inside their own Dockerfiles and do NOT need the C++ build tree,
  # so this job has no `needs` and runs concurrently with compile. Each image
  # builds on its own runner (matrix) via docker/build-push-action with the
  # GitHub Actions layer cache (scoped per image and architecture), so the Go
  # module download and build layers persist across runs without amd64 and arm64
  # overwriting each other. BuildKit exports the image directly as the tarball
  # uploaded for downstream consumers.
  images-go:
    name: Go image (${{ matrix.image.name }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: cacheserver-scheduler
            context: src/subsystems/storage/cache_server_scheduler
            file: Docker/CacheServerScheduler.Dockerfile
          - name: cache-controller
            context: src/subsystems/cache-controller
            file: src/subsystems/cache-controller/Dockerfile
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Stage compliance files
        env:
          IMAGE_CONTEXT: ${{ matrix.image.context }}
        run: |
          cp LICENSE "${IMAGE_CONTEXT}/LICENSE"
          cp NOTICE.txt "${IMAGE_CONTEXT}/NOTICE.txt"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Resolve image version
        id: image
        run: |
          version="$(./.pipelines/scripts/get-version.sh container)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.image.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          tags: |
            ${{ matrix.image.name }}:local
            ${{ matrix.image.name }}:${{ steps.image.outputs.version }}
          outputs: type=docker,dest=${{ runner.temp }}/dacs-image-${{ matrix.image.name }}.tar
          cache-from: >-
            ${{ !startsWith(github.ref, 'refs/tags/') &&
            format('type=gha,scope={0}-{1}', matrix.image.name, inputs.build_arch) || '' }}
          cache-to: >-
            ${{ !startsWith(github.ref, 'refs/tags/') &&
            format('type=gha,scope={0}-{1},mode=max', matrix.image.name, inputs.build_arch) || '' }}

      - name: Upload ${{ matrix.image.name }} image
        uses: $/.github/actions/upload-image
        with:
          name: ${{ matrix.image.name }}
          arch: ${{ inputs.build_arch }}

  # Build the two C++ component images (cache-server, cache-test-client). They
  # need the compiled build tree but not the native-build toolchain image.
  # Buildx caches their dependency layers independently per image and architecture.
  images-cpp:
    name: C++ image (${{ matrix.image.name }})
    needs: compile
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BUILD_TYPE: ${{ inputs.build_type }}
      BUILD_ARCH: ${{ inputs.build_arch }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: cache-server
            file: CacheServer.Dockerfile
            cache-mode: min
          - name: cache-test-client
            file: CacheClient.Dockerfile
            cache-mode: max
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Restore build tree
        uses: $/.github/actions/restore-build
        with:
          artifact: dacs-build-tree-${{ inputs.build_arch }}
          restore-native-build-image: 'false'

      # Stage the compiled binaries (bin/) into the Docker/ build context that the
      # component Dockerfiles COPY from.
      - name: Stage binaries into the Docker context
        run: ./.pipelines/scripts/build/copy-binaries.sh
        env:
          BUILD_CONFIGURATION: ${{ inputs.build_type }}
          BUILD_ARCH: ${{ inputs.build_arch }}

      - name: Resolve image version
        id: image
        run: |
          version="$(./.pipelines/scripts/get-version.sh container)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.image.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: Docker
          file: Docker/${{ matrix.image.file }}
          no-cache-filters: runtime
          tags: |
            ${{ matrix.image.name }}:local
            ${{ matrix.image.name }}:${{ steps.image.outputs.version }}
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/dacs-image-${{ matrix.image.name }}.tar
          cache-from: >-
            ${{ !startsWith(github.ref, 'refs/tags/') &&
            format('type=gha,scope={0}-{1}', matrix.image.name, inputs.build_arch) || '' }}
          cache-to: >-
            ${{ !startsWith(github.ref, 'refs/tags/') &&
            format(
              'type=gha,scope={0}-{1},mode={2}',
              matrix.image.name,
              inputs.build_arch,
              matrix.image.cache-mode
            ) || '' }}

      - name: Upload ${{ matrix.image.name }} image
        uses: $/.github/actions/upload-image
        with:
          name: ${{ matrix.image.name }}
          arch: ${{ inputs.build_arch }}

  # Build the Python wheel and Rust crate in one job so the large native-build
  # image and build tree are restored only once.
  packages:
    name: Python and Rust packages
    needs: compile
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BUILD_TYPE: ${{ inputs.build_type }}
      BUILD_ARCH: ${{ inputs.build_arch }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Restore build tree
        uses: $/.github/actions/restore-build
        with:
          artifact: dacs-build-tree-${{ inputs.build_arch }}
          native-build-image-artifact: dacs-native-build-image-${{ inputs.build_arch }}

      - name: Build wheel
        run: make python-package

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dacs-wheel-${{ inputs.build_arch }}
          path: src/subsystems/storage/dacs_client/dist/*.whl
          retention-days: 1
          if-no-files-found: error

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/dacs-cargo
            src/subsystems/storage/rust/dacs_client/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/subsystems/storage/rust/dacs_client/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build Rust crate
        run: make rust-package

      - name: Upload Rust crate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dacs-rust-crate-${{ inputs.build_arch }}
          path: src/subsystems/storage/rust/dacs_client/target/package/*.crate
          retention-days: 1
          if-no-files-found: error
