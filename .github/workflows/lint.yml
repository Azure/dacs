name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release-**]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test version derivation
        run: ./.pipelines/scripts/tests/test-get-version.sh

      - name: Test Helm chart publication
        run: ./.pipelines/scripts/tests/test-helm-publication.sh

      - name: Test release package assembly
        run: ./.pipelines/scripts/tests/test-prepare-package-artifacts.sh

      - name: Test candidate image publication and archives
        run: ./.pipelines/scripts/tests/test-candidate-images.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install pre-commit
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          -r .github/workflows/linter-requirements.txt

      # Cache the installed hook environments (keyed on the config) so repeat
      # runs skip re-provisioning each hook toolchain.
      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
