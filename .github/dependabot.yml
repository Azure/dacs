# Dependabot configuration for DACS
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Goal: automatically patch container base images and Go module CVEs
# (FedRAMP image-vuln scanning context).
#
# Note on Docker ecosystem:
#   Dependabot updates the FROM lines in Dockerfiles. It does NOT patch
#   apt packages installed via RUN apt-get install. System-package CVEs
#   are picked up indirectly when the upstream base image tag is bumped
#   and the image is rebuilt (the Dockerfiles already run apt-get update
#   at build time).

version: 2
updates:
  # ---------------------------------------------------------------------------
  # Docker base images
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directories:
      - "/Docker"
      - "/Docker/base"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
      - "security"
    commit-message:
      prefix: "deps(docker)"
    groups:
      docker-base-images:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # Go modules
  # ---------------------------------------------------------------------------
  - package-ecosystem: "gomod"
    directory: "/src/subsystems/cache-controller"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps(go,cache-controller)"
    groups:
      go-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/src/subsystems/storage/cache_server_scheduler"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps(go,scheduler)"
    groups:
      go-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/test"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
      - "test"
    commit-message:
      prefix: "deps(go,test)"
    groups:
      go-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # GitHub Actions used by the cache-controller subtree
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/src/subsystems/cache-controller"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
