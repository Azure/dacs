version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directories:
      - /Docker
      - /src/images/native-build
      - /src/subsystems/cache-controller
      - /src/subsystems/storage/stress_tests/container
    schedule:
      interval: "daily"
    groups:
      docker:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: "daily"
    groups:
      go-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directories:
      - /.github/workflows
      - /.pipelines/requirements
      - /Docker/requirements
      - /src/images/native-build
      - /src/subsystems/storage/dacs_client
      - /src/subsystems/storage/storage_intercept/integration_tests
      - /src/subsystems/storage/stress_tests/container
    schedule:
      interval: "daily"
    groups:
      pip-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      pip-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: h5py
        versions:
          - "3.16.0"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: "daily"
    groups:
      pre-commit:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7
