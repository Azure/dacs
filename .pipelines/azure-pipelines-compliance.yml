trigger:
  batch: true
  branches:
    include:
      - main
pr: none

# Optional weekly re-scan to catch newly published CVEs / term-table updates.
schedules:
  - cron: "0 6 * * 1"
    displayName: Weekly SDL compliance scan
    branches:
      include:
        - main
    always: true

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: 1es-dacs-pool
      image: 1es-windows-2022
      os: windows
    sdl:
      sourceAnalysisPool:
        name: 1es-dacs-pool
        image: 1es-windows-2022
        os: windows
      policheck:
        enabled: true
      credscan:
        enabled: true
    stages:
      - stage: Compliance
        displayName: SDL source analysis
        jobs:
          - job: CheckoutForSdl
            displayName: Check out sources for SDL scan
            steps:
              - checkout: self
                submodules: true
              - script: echo "Sources checked out. SDL source-analysis tools run in the injected SDLSources stage."
                displayName: Source checkout marker
