trigger:
  batch: true
  branches:
    include:
      - main
pr: none

# Optional weekly re-scan to catch newly published CVEs / term-table updates.
schedules:
  - cron: "0 6 * * 1"
    displayName: Weekly SDL compliance scan
    branches:
      include:
        - main
    always: true

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      sourceAnalysisPool:
        name: 1es-dacs-pool
        image: 1es-windows-2022
        os: windows
      policheck:
        enabled: true
      credscan:
        enabled: true
