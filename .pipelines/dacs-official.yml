trigger:
  branches:
    include:
      - main
pr:
  branches:
    include:
      - main

schedules:
  - cron: "0 6 * * 0"
    displayName: Weekly DACS build
    branches:
      include:
        - main
    always: true

parameters:
  - name: acrName
    displayName: ACR name without azurecr.io
    type: string
    default: dacstest
  - name: azureServiceConnection
    displayName: Azure Resource Manager service connection
    type: string
    default: dacs ARM Connection
  - name: enableAzureTests
    displayName: Run Azure-backed storage tests
    type: boolean
    default: true
  - name: azureStorageBlobPath
    displayName: Azure Blob fixture path
    type: string
    default: az://dacstest.blob.core.windows.net/dataset/client-integration
resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: 1es-dacs-pool
      image: 1es-pt-linux-amd64
      os: linux
      hostArchitecture: amd64
    sdl:
      sourceAnalysisPool:
        name: 1es-dacs-pool
        image: 1es-windows-2022
        os: windows
      policheck:
        enabled: true
      credscan:
        enabled: true
    stages:
      - stage: Build_amd64
        displayName: Compile linux/amd64
        dependsOn: []
        jobs:
          - job: Build_amd64
            displayName: Compile linux/amd64
            timeoutInMinutes: 120
            templateContext:
              outputs:
                - output: pipelineArtifact
                  path: $(Build.ArtifactStagingDirectory)/build-tree
                  artifact: dacs-build-tree-linux-amd64
                - output: pipelineArtifact
                  path: $(Build.ArtifactStagingDirectory)/python-wheel
                  artifact: dacs-python-wheel-linux-amd64
                - output: pipelineArtifact
                  path: $(Build.ArtifactStagingDirectory)/rust-crate
                  artifact: dacs-rust-crate-linux-amd64
            steps:
              - checkout: self
                path: s/dacs
                fetchDepth: 0
                fetchTags: true
                persistCredentials: true
              - template: /.pipelines/templates/Dacs.Build.Steps.yml@self
                parameters:
                  architecture: amd64
                  acrName: ${{ parameters.acrName }}
                  azureServiceConnection: ${{ parameters.azureServiceConnection }}

      - stage: Build_arm64
        displayName: Compile linux/arm64
        dependsOn: []
        pool:
          name: 1es-dacs-pool-arm64
          image: 1es-pt-linux-arm64
          os: linux
          hostArchitecture: arm64
        jobs:
          - job: Build_arm64
            displayName: Compile linux/arm64
            timeoutInMinutes: 120
            templateContext:
              outputs:
                - output: pipelineArtifact
                  path: $(Build.ArtifactStagingDirectory)/build-tree
                  artifact: dacs-build-tree-linux-arm64
                - output: pipelineArtifact
                  path: $(Build.ArtifactStagingDirectory)/python-wheel
                  artifact: dacs-python-wheel-linux-arm64
                - output: pipelineArtifact
                  path: $(Build.ArtifactStagingDirectory)/rust-crate
                  artifact: dacs-rust-crate-linux-arm64
            steps:
              - checkout: self
                path: s/dacs
                fetchDepth: 0
                fetchTags: true
                persistCredentials: true
              - template: /.pipelines/templates/Dacs.Build.Steps.yml@self
                parameters:
                  architecture: arm64
                  acrName: ${{ parameters.acrName }}
                  azureServiceConnection: ${{ parameters.azureServiceConnection }}

      - stage: Images_amd64
        displayName: Build linux/amd64 images
        dependsOn: Build_amd64
        jobs:
          - job: Images_amd64
            displayName: Build linux/amd64 images
            timeoutInMinutes: 120
            templateContext:
              outputs:
                - output: pipelineArtifact
                  path: $(Build.ArtifactStagingDirectory)/container-images
                  artifact: container-images-linux-amd64
            steps:
              - template: /.pipelines/templates/Dacs.ImageBuild.Steps.yml@self
                parameters:
                  architecture: amd64
                  acrName: ${{ parameters.acrName }}
                  azureServiceConnection: ${{ parameters.azureServiceConnection }}

      - stage: Images_arm64
        displayName: Build linux/arm64 images
        dependsOn: Build_arm64
        pool:
          name: 1es-dacs-pool-arm64
          image: 1es-pt-linux-arm64
          os: linux
          hostArchitecture: arm64
        jobs:
          - job: Images_arm64
            displayName: Build linux/arm64 images
            timeoutInMinutes: 120
            templateContext:
              outputs:
                - output: pipelineArtifact
                  path: $(Build.ArtifactStagingDirectory)/container-images
                  artifact: container-images-linux-arm64
            steps:
              - template: /.pipelines/templates/Dacs.ImageBuild.Steps.yml@self
                parameters:
                  architecture: arm64
                  acrName: ${{ parameters.acrName }}
                  azureServiceConnection: ${{ parameters.azureServiceConnection }}

      - stage: AzureTests_amd64
        displayName: Azure-backed tests linux/amd64
        dependsOn: Build_amd64
        condition: >-
          and(
            succeeded(),
            ${{ eq(parameters.enableAzureTests, true) }},
            or(
              eq(variables['Build.SourceBranch'], 'refs/heads/main'),
              eq(variables['Build.Reason'], 'Manual')
            )
          )
        jobs:
          - template: /.pipelines/templates/Dacs.StorageTest.Jobs.yml@self
            parameters:
              architecture: amd64
              acrName: ${{ parameters.acrName }}
              azureServiceConnection: ${{ parameters.azureServiceConnection }}
              azureStorageBlobPath: ${{ parameters.azureStorageBlobPath }}
          - template: /.pipelines/templates/Dacs.PythonTest.Job.yml@self
            parameters:
              architecture: amd64
              acrName: ${{ parameters.acrName }}
              azureServiceConnection: ${{ parameters.azureServiceConnection }}
              azureStorageBlobPath: ${{ parameters.azureStorageBlobPath }}

      - stage: AzureTests_arm64
        displayName: Azure-backed tests linux/arm64
        dependsOn: Build_arm64
        pool:
          name: 1es-dacs-pool-arm64
          image: 1es-pt-linux-arm64
          os: linux
          hostArchitecture: arm64
        condition: >-
          and(
            succeeded(),
            ${{ eq(parameters.enableAzureTests, true) }},
            or(
              eq(variables['Build.SourceBranch'], 'refs/heads/main'),
              eq(variables['Build.Reason'], 'Manual')
            )
          )
        jobs:
          - template: /.pipelines/templates/Dacs.StorageTest.Jobs.yml@self
            parameters:
              architecture: arm64
              acrName: ${{ parameters.acrName }}
              azureServiceConnection: ${{ parameters.azureServiceConnection }}
              azureStorageBlobPath: ${{ parameters.azureStorageBlobPath }}
          - template: /.pipelines/templates/Dacs.PythonTest.Job.yml@self
            parameters:
              architecture: arm64
              acrName: ${{ parameters.acrName }}
              azureServiceConnection: ${{ parameters.azureServiceConnection }}
              azureStorageBlobPath: ${{ parameters.azureStorageBlobPath }}

      - stage: Package
        displayName: Package DACS artifacts
        dependsOn:
          - Images_amd64
          - Images_arm64
        condition: >-
          and(
            in(dependencies.Images_amd64.result, 'Succeeded', 'SucceededWithIssues'),
            in(dependencies.Images_arm64.result, 'Succeeded', 'SucceededWithIssues')
          )
        jobs:
          - job: Package
            displayName: Package artifacts
            timeoutInMinutes: 120
            templateContext:
              outputs:
                - output: pipelineArtifact
                  path: $(Build.ArtifactStagingDirectory)/helm-charts
                  artifact: helm-charts
                - output: pipelineArtifact
                  path: $(Build.ArtifactStagingDirectory)/release-metadata
                  artifact: release-metadata
            steps:
              - checkout: self
                path: s/dacs
                fetchDepth: 0
                fetchTags: true
              - task: HelmInstaller@1
                displayName: Install Helm
                inputs:
                  helmVersionToInstall: 3.21.3
              - template: /.pipelines/templates/Dacs.Version.Steps.yml@self
              - bash: |
                  set -euo pipefail
                  helm version
                  git version
                displayName: Check packaging tools
              - bash: |
                  set -euo pipefail
                  readonly registry="${{ parameters.acrName }}.azurecr.io"
                  export DOCKER_REGISTRY="$registry"
                  ./.pipelines/scripts/publish/publish-helm-chart.sh

                  readonly helm_artifacts="$(Build.ArtifactStagingDirectory)/helm-charts"
                  readonly release_metadata="$(Build.ArtifactStagingDirectory)/release-metadata"
                  mkdir -p "$helm_artifacts" "$release_metadata"

                  cp dist/*.tgz "$helm_artifacts/"
                  cp helm-chart.txt "$helm_artifacts/"
                  (
                    cd "$helm_artifacts"
                    sha256sum ./*.tgz helm-chart.txt > SHA256SUMS
                  )

                  printf '%s\n' \
                    "SOURCE_VERSION=$(./.pipelines/scripts/get-version.sh source)" \
                    "CONTAINER_VERSION=$(finalTag)" \
                    "GIT_COMMIT=$(git rev-parse HEAD)" \
                    "IMAGE_ARTIFACT_AMD64=container-images-linux-amd64" \
                    "IMAGE_ARTIFACT_ARM64=container-images-linux-arm64" \
                    "CACHE_SERVER_IMAGE=$registry/dacs/cache-server:$(finalTag)-linux-{amd64,arm64}" \
                    "CACHE_CLIENT_IMAGE=$registry/dacs/cache-test-client:$(finalTag)-linux-{amd64,arm64}" \
                    "CACHE_SERVER_SCHEDULER_IMAGE=$registry/dacs/cacheserver-scheduler:$(finalTag)-linux-{amd64,arm64}" \
                    "CACHE_CONTROLLER_IMAGE=$registry/dacs/cache-controller:$(finalTag)-linux-{amd64,arm64}" \
                    > "$release_metadata/docker-images.txt"
                  cp helm-chart.txt "$release_metadata/"
                displayName: Package versioned artifacts
                workingDirectory: $(Pipeline.Workspace)/s/dacs
