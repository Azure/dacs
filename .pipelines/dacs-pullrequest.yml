# Register this YAML as the dacs-pullrequest pipeline, then run it from a
# GitHub pull request with "/azp run dacs-pullrequest".
trigger: none
pr: none

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: 1es-dacs-pool
      image: 1es-pt-linux-amd64
      os: linux
      hostArchitecture: amd64
    stages:
      - stage: Validate
        displayName: Validate pull request pipeline
        jobs:
          - job: Placeholder
            displayName: Run placeholder validation
            steps:
              - script: echo "Pull request pipeline is configured."
                displayName: Validate pipeline configuration
