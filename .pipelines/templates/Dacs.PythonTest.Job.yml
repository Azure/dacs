parameters:
  - name: architecture
    type: string
  - name: acrName
    type: string
  - name: azureServiceConnection
    type: string
  - name: azureStorageBlobPath
    type: string

jobs:
  - job: PythonTests_${{ parameters.architecture }}
    displayName: ${{ parameters.architecture }} - Python Azure tests
    timeoutInMinutes: 60
    steps:
      - template: Dacs.RestoreBuild.Steps.yml
        parameters:
          architecture: ${{ parameters.architecture }}
          restoreWheel: true
      - template: Dacs.AzureAuthentication.Steps.yml
        parameters:
          architecture: ${{ parameters.architecture }}
          acrName: ${{ parameters.acrName }}
          azureServiceConnection: ${{ parameters.azureServiceConnection }}
          azureStorageBlobPath: ${{ parameters.azureStorageBlobPath }}
      - bash: |
          set -euo pipefail
          BUILD_ARCH="${{ parameters.architecture }}" \
          DACS_TEST_MODE="wheel" \
          DOCKER_REGISTRY="${{ parameters.acrName }}.azurecr.io" \
          USE_AZURE_CFS=true \
          AZURE_BLOB_PATH="$DACS_AZURE_STORAGE_BLOB_PATH" \
          SI_azBlobAccessToken="$(SI_azBlobAccessToken)" \
          AZURE_CLIENT_ID="$(AZURE_CLIENT_ID)" \
          USER_VM_AZURE_CLIENT_ID="$(AZURE_CLIENT_ID)" \
          AZURE_TENANT_ID="$(AZURE_TENANT_ID)" \
          AZURE_FEDERATED_TOKEN="$(AZURE_FEDERATED_TOKEN)" \
            make pytest BUILD_TYPE=Release
        workingDirectory: $(Pipeline.Workspace)/s/dacs
        displayName: Run Python Azure tests
        env:
          AZURE_FEDERATED_TOKEN: $(AZURE_FEDERATED_TOKEN)
          DACS_AZURE_STORAGE_BLOB_PATH: ${{ parameters.azureStorageBlobPath }}
          SI_azBlobAccessToken: $(SI_azBlobAccessToken)
      - task: PublishTestResults@2
        displayName: Publish Python Azure test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: pytest-results*.xml
          searchFolder: $(Pipeline.Workspace)/s/dacs
          failTaskOnFailedTests: true
          testRunTitle: Python Azure linux/${{ parameters.architecture }}
