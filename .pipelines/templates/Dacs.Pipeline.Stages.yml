parameters:
  - name: acrName
    displayName: ACR name without azurecr.io
    type: string
    default: dacstest
  - name: azureServiceConnection
    displayName: Azure Resource Manager service connection
    type: string
    default: dacs ARM Connection
  - name: azureStorageBlobPath
    displayName: Azure Blob fixture path
    type: string
    default: az://dacstest.blob.core.windows.net/dataset/client-integration
  - name: pushNativeBuildImages
    displayName: Push rolling native-build tags
    type: boolean
    default: false

stages:
  - stage: Build_amd64
    displayName: Compile linux/amd64
    dependsOn: []
    jobs:
      - job: Build_amd64
        displayName: Compile linux/amd64
        timeoutInMinutes: 120
        templateContext:
          outputs:
            - output: pipelineArtifact
              path: $(Build.ArtifactStagingDirectory)/build-tree
              artifact: dacs-build-tree-linux-amd64
            - output: pipelineArtifact
              path: $(Build.ArtifactStagingDirectory)/python-wheel
              artifact: dacs-python-wheel-linux-amd64
            - output: pipelineArtifact
              path: $(Build.ArtifactStagingDirectory)/rust-crate
              artifact: dacs-rust-crate-linux-amd64
        steps:
          - checkout: self
            path: s/dacs
            fetchDepth: 0
            fetchTags: true
            persistCredentials: true
          - template: /.pipelines/templates/Dacs.Build.Steps.yml@self
            parameters:
              architecture: amd64
              acrName: ${{ parameters.acrName }}
              azureServiceConnection: ${{ parameters.azureServiceConnection }}
              pushNativeBuildImage: ${{ parameters.pushNativeBuildImages }}

  - stage: Build_arm64
    displayName: Compile linux/arm64
    dependsOn: []
    pool:
      name: 1es-dacs-pool-arm64
      image: 1es-pt-linux-arm64
      os: linux
      hostArchitecture: arm64
    jobs:
      - job: Build_arm64
        displayName: Compile linux/arm64
        timeoutInMinutes: 120
        templateContext:
          outputs:
            - output: pipelineArtifact
              path: $(Build.ArtifactStagingDirectory)/build-tree
              artifact: dacs-build-tree-linux-arm64
            - output: pipelineArtifact
              path: $(Build.ArtifactStagingDirectory)/python-wheel
              artifact: dacs-python-wheel-linux-arm64
            - output: pipelineArtifact
              path: $(Build.ArtifactStagingDirectory)/rust-crate
              artifact: dacs-rust-crate-linux-arm64
        steps:
          - checkout: self
            path: s/dacs
            fetchDepth: 0
            fetchTags: true
            persistCredentials: true
          - template: /.pipelines/templates/Dacs.Build.Steps.yml@self
            parameters:
              architecture: arm64
              acrName: ${{ parameters.acrName }}
              azureServiceConnection: ${{ parameters.azureServiceConnection }}
              pushNativeBuildImage: ${{ parameters.pushNativeBuildImages }}

  - stage: Images_amd64
    displayName: Build linux/amd64 images
    dependsOn: Build_amd64
    jobs:
      - job: Images_amd64
        displayName: Build linux/amd64 images
        timeoutInMinutes: 120
        templateContext:
          outputs:
            - output: pipelineArtifact
              path: $(Build.ArtifactStagingDirectory)/container-images
              artifact: container-images-linux-amd64
        steps:
          - template: /.pipelines/templates/Dacs.ImageBuild.Steps.yml@self
            parameters:
              architecture: amd64
              acrName: ${{ parameters.acrName }}
              azureServiceConnection: ${{ parameters.azureServiceConnection }}

  - stage: Images_arm64
    displayName: Build linux/arm64 images
    dependsOn: Build_arm64
    pool:
      name: 1es-dacs-pool-arm64
      image: 1es-pt-linux-arm64
      os: linux
      hostArchitecture: arm64
    jobs:
      - job: Images_arm64
        displayName: Build linux/arm64 images
        timeoutInMinutes: 120
        templateContext:
          outputs:
            - output: pipelineArtifact
              path: $(Build.ArtifactStagingDirectory)/container-images
              artifact: container-images-linux-arm64
        steps:
          - template: /.pipelines/templates/Dacs.ImageBuild.Steps.yml@self
            parameters:
              architecture: arm64
              acrName: ${{ parameters.acrName }}
              azureServiceConnection: ${{ parameters.azureServiceConnection }}

  - stage: AzureTests_amd64
    displayName: Azure-backed tests linux/amd64
    dependsOn: Build_amd64
    jobs:
      - template: /.pipelines/templates/Dacs.StorageTest.Jobs.yml@self
        parameters:
          architecture: amd64
          acrName: ${{ parameters.acrName }}
          azureServiceConnection: ${{ parameters.azureServiceConnection }}
          azureStorageBlobPath: ${{ parameters.azureStorageBlobPath }}
      - template: /.pipelines/templates/Dacs.PythonTest.Job.yml@self
        parameters:
          architecture: amd64
          acrName: ${{ parameters.acrName }}
          azureServiceConnection: ${{ parameters.azureServiceConnection }}
          azureStorageBlobPath: ${{ parameters.azureStorageBlobPath }}

  - stage: AzureTests_arm64
    displayName: Azure-backed tests linux/arm64
    dependsOn: Build_arm64
    pool:
      name: 1es-dacs-pool-arm64
      image: 1es-pt-linux-arm64
      os: linux
      hostArchitecture: arm64
    jobs:
      - template: /.pipelines/templates/Dacs.StorageTest.Jobs.yml@self
        parameters:
          architecture: arm64
          acrName: ${{ parameters.acrName }}
          azureServiceConnection: ${{ parameters.azureServiceConnection }}
          azureStorageBlobPath: ${{ parameters.azureStorageBlobPath }}
      - template: /.pipelines/templates/Dacs.PythonTest.Job.yml@self
        parameters:
          architecture: arm64
          acrName: ${{ parameters.acrName }}
          azureServiceConnection: ${{ parameters.azureServiceConnection }}
          azureStorageBlobPath: ${{ parameters.azureStorageBlobPath }}

  - stage: Package
    displayName: Package DACS artifacts
    dependsOn:
      - Images_amd64
      - Images_arm64
    condition: >-
      and(
        in(dependencies.Images_amd64.result, 'Succeeded', 'SucceededWithIssues'),
        in(dependencies.Images_arm64.result, 'Succeeded', 'SucceededWithIssues')
      )
    jobs:
      - job: Package
        displayName: Package artifacts
        timeoutInMinutes: 120
        templateContext:
          outputs:
            - output: pipelineArtifact
              path: $(Build.ArtifactStagingDirectory)/helm-charts
              artifact: helm-charts
            - output: pipelineArtifact
              path: $(Build.ArtifactStagingDirectory)/release-metadata
              artifact: release-metadata
        steps:
          - checkout: self
            path: s/dacs
            fetchDepth: 0
            fetchTags: true
          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: 3.21.3
          - template: /.pipelines/templates/Dacs.Version.Steps.yml@self
          - bash: |
              set -euo pipefail
              helm version
              git version
            displayName: Check packaging tools
          - bash: |
              set -euo pipefail
              readonly registry="${{ parameters.acrName }}.azurecr.io"
              export DOCKER_REGISTRY="$registry"
              ./.pipelines/scripts/publish/publish-helm-chart.sh

              readonly helm_artifacts="$(Build.ArtifactStagingDirectory)/helm-charts"
              readonly release_metadata="$(Build.ArtifactStagingDirectory)/release-metadata"
              mkdir -p "$helm_artifacts" "$release_metadata"

              cp dist/*.tgz "$helm_artifacts/"
              cp helm-chart.txt "$helm_artifacts/"
              (
                cd "$helm_artifacts"
                sha256sum ./*.tgz helm-chart.txt > SHA256SUMS
              )

              printf '%s\n' \
                "SOURCE_VERSION=$(./.pipelines/scripts/get-version.sh source)" \
                "CONTAINER_VERSION=$(finalTag)" \
                "GIT_COMMIT=$(git rev-parse HEAD)" \
                "IMAGE_ARTIFACT_AMD64=container-images-linux-amd64" \
                "IMAGE_ARTIFACT_ARM64=container-images-linux-arm64" \
                "CACHE_SERVER_IMAGE=$registry/dacs/cache-server:$(finalTag)-linux-{amd64,arm64}" \
                "CACHE_CLIENT_IMAGE=$registry/dacs/cache-test-client:$(finalTag)-linux-{amd64,arm64}" \
                "CACHE_SERVER_SCHEDULER_IMAGE=$registry/dacs/cacheserver-scheduler:$(finalTag)-linux-{amd64,arm64}" \
                "CACHE_CONTROLLER_IMAGE=$registry/dacs/cache-controller:$(finalTag)-linux-{amd64,arm64}" \
                > "$release_metadata/docker-images.txt"
              cp helm-chart.txt "$release_metadata/"

              printf '%s\n' \
                "CONTAINER_VERSION=$(finalTag)" \
                "GIT_COMMIT=$(git rev-parse HEAD)" \
                "IMAGE_REGISTRY=$registry/dacs" \
                > "$release_metadata/release.env"
            displayName: Package versioned artifacts
            workingDirectory: $(Pipeline.Workspace)/s/dacs

  - stage: PublishImages
    displayName: Publish immutable DACS artifacts
    dependsOn:
      - Package
      - AzureTests_amd64
      - AzureTests_arm64
    jobs:
      - job: PublishImages
        displayName: Publish immutable images and Helm charts
        timeoutInMinutes: 120
        steps:
          - checkout: self
            path: s/dacs
            fetchDepth: 1

          - task: DownloadPipelineArtifact@2
            displayName: Download linux/amd64 images
            inputs:
              buildType: current
              artifact: container-images-linux-amd64
              targetPath: $(Pipeline.Workspace)/artifacts/container-images-linux-amd64

          - task: DownloadPipelineArtifact@2
            displayName: Download linux/arm64 images
            inputs:
              buildType: current
              artifact: container-images-linux-arm64
              targetPath: $(Pipeline.Workspace)/artifacts/container-images-linux-arm64

          - task: DownloadPipelineArtifact@2
            displayName: Download release metadata
            inputs:
              buildType: current
              artifact: release-metadata
              targetPath: $(Pipeline.Workspace)/artifacts/release-metadata

          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: 3.21.3

          - task: DownloadPipelineArtifact@2
            displayName: Download Helm charts
            inputs:
              buildType: current
              artifact: helm-charts
              targetPath: $(Pipeline.Workspace)/artifacts/helm-charts

          - task: AzureCLI@2
            displayName: Publish immutable images
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                readonly repository_root="$(Pipeline.Workspace)/s/dacs"
                readonly artifacts_root="$(Pipeline.Workspace)/artifacts"
                readonly release_metadata="$artifacts_root/release-metadata/release.env"
                test -f "$release_metadata"
                # shellcheck disable=SC1090
                source "$release_metadata"
                : "${CONTAINER_VERSION:?release metadata is missing CONTAINER_VERSION}"
                : "${IMAGE_REGISTRY:?release metadata is missing IMAGE_REGISTRY}"

                for architecture in amd64 arm64; do
                  image_dir="$artifacts_root/container-images-linux-$architecture"
                  (
                    cd "$image_dir"
                    sha256sum -c SHA256SUMS
                  )

                  while IFS= read -r -d '' archive; do
                    gzip -dc "$archive" | docker load
                  done < <(find "$image_dir" -maxdepth 1 -name '*.tar.gz' -print0)
                done

                az acr login --name "${{ parameters.acrName }}"

                for architecture in amd64 arm64; do
                  for image in \
                    cache-server \
                    cache-test-client \
                    cacheserver-scheduler \
                    cache-controller; do
                    docker push \
                      "${IMAGE_REGISTRY}/${image}:${CONTAINER_VERSION}-linux-${architecture}"
                  done
                done

                DOCKER_REGISTRY="$IMAGE_REGISTRY" \
                BUILD_NUMBER="$CONTAINER_VERSION" \
                BUILD_ARCHS="amd64 arm64" \
                  "$repository_root/.pipelines/scripts/publish/publish-multiplatform-manifests.sh"

          - task: AzureCLI@2
            displayName: Publish immutable Helm charts
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                readonly chart_artifacts="$(Pipeline.Workspace)/artifacts/helm-charts"
                readonly chart_metadata="$chart_artifacts/helm-chart.txt"
                test -f "$chart_metadata"

                (
                  cd "$chart_artifacts"
                  sha256sum -c SHA256SUMS
                )

                # shellcheck disable=SC1090
                source "$chart_metadata"
                : "${CHART_REPO:?chart metadata is missing CHART_REPO}"
                : "${CACHE_SERVER_CHART_VERSION:?chart metadata is missing CACHE_SERVER_CHART_VERSION}"
                : "${CACHE_SERVER_PREREQ_CHART_VERSION:?chart metadata is missing CACHE_SERVER_PREREQ_CHART_VERSION}"
                : "${CACHE_CONTROLLER_CHART_VERSION:?chart metadata is missing CACHE_CONTROLLER_CHART_VERSION}"

                readonly charts=(
                  "$chart_artifacts/cache-server-$CACHE_SERVER_CHART_VERSION.tgz"
                  "$chart_artifacts/dacs-prereq-$CACHE_SERVER_PREREQ_CHART_VERSION.tgz"
                  "$chart_artifacts/dacs-$CACHE_CONTROLLER_CHART_VERSION.tgz"
                )
                for chart in "${charts[@]}"; do
                  test -f "$chart"
                done

                az acr login --name "${{ parameters.acrName }}"
                for chart in "${charts[@]}"; do
                  helm push "$chart" "$CHART_REPO"
                done
