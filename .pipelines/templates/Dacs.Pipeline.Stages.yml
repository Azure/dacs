parameters:
  - name: acrName
    displayName: ACR name without azurecr.io
    type: string
    default: dacstest
  - name: azureServiceConnection
    displayName: Azure Resource Manager service connection
    type: string
    default: dacs ARM Connection
  - name: azureStorageBlobPath
    displayName: Azure Blob fixture path
    type: string
    default: az://dacstest.blob.core.windows.net/dataset/client-integration
  - name: pushNativeBuildImages
    displayName: Push exact and rolling native-build tags
    type: boolean
    default: false
  - name: buildCacheScope
    displayName: Registry BuildKit cache scope
    type: string

stages:
  - stage: Build_amd64
    displayName: Compile linux/amd64
    dependsOn: []
    jobs:
      - job: Build_amd64
        displayName: Compile linux/amd64
        timeoutInMinutes: 120
        templateContext:
          outputs:
            - output: pipelineArtifact
              path: $(Build.ArtifactStagingDirectory)/build
              artifact: dacs-build-linux-amd64
        steps:
          - checkout: self
            path: s/dacs
            fetchDepth: 0
            fetchTags: true
            persistCredentials: true
          - template: /.pipelines/templates/Dacs.VerifyBaseImages.Steps.yml@self
          - template: /.pipelines/templates/Dacs.Build.Steps.yml@self
            parameters:
              architecture: amd64
              acrName: ${{ parameters.acrName }}
              azureServiceConnection: ${{ parameters.azureServiceConnection }}
              pushNativeBuildImage: ${{ parameters.pushNativeBuildImages }}
              buildCacheScope: ${{ parameters.buildCacheScope }}

  - stage: Build_arm64
    displayName: Compile linux/arm64
    dependsOn: []
    pool:
      name: 1es-dacs-pool-arm64
      image: 1es-pt-linux-arm64
      os: linux
      hostArchitecture: arm64
    jobs:
      - job: Build_arm64
        displayName: Compile linux/arm64
        timeoutInMinutes: 120
        templateContext:
          outputs:
            - output: pipelineArtifact
              path: $(Build.ArtifactStagingDirectory)/build
              artifact: dacs-build-linux-arm64
        steps:
          - checkout: self
            path: s/dacs
            fetchDepth: 0
            fetchTags: true
            persistCredentials: true
          - template: /.pipelines/templates/Dacs.VerifyBaseImages.Steps.yml@self
          - template: /.pipelines/templates/Dacs.Build.Steps.yml@self
            parameters:
              architecture: arm64
              acrName: ${{ parameters.acrName }}
              azureServiceConnection: ${{ parameters.azureServiceConnection }}
              pushNativeBuildImage: ${{ parameters.pushNativeBuildImages }}
              buildCacheScope: ${{ parameters.buildCacheScope }}

  - stage: Images_amd64
    displayName: Build linux/amd64 images
    dependsOn: Build_amd64
    jobs:
      - job: Images_amd64
        displayName: Build linux/amd64 images
        timeoutInMinutes: 120
        steps:
          - template: /.pipelines/templates/Dacs.ImageBuild.Steps.yml@self
            parameters:
              architecture: amd64
              acrName: ${{ parameters.acrName }}
              azureServiceConnection: ${{ parameters.azureServiceConnection }}
              buildCacheScope: ${{ parameters.buildCacheScope }}

  - stage: Images_arm64
    displayName: Build linux/arm64 images
    dependsOn: Build_arm64
    pool:
      name: 1es-dacs-pool-arm64
      image: 1es-pt-linux-arm64
      os: linux
      hostArchitecture: arm64
    jobs:
      - job: Images_arm64
        displayName: Build linux/arm64 images
        timeoutInMinutes: 120
        steps:
          - template: /.pipelines/templates/Dacs.ImageBuild.Steps.yml@self
            parameters:
              architecture: arm64
              acrName: ${{ parameters.acrName }}
              azureServiceConnection: ${{ parameters.azureServiceConnection }}
              buildCacheScope: ${{ parameters.buildCacheScope }}

  - stage: AzureTests_amd64
    displayName: Azure-backed tests linux/amd64
    dependsOn: Build_amd64
    jobs:
      - template: /.pipelines/templates/Dacs.StorageTest.Jobs.yml@self
        parameters:
          architecture: amd64
          acrName: ${{ parameters.acrName }}
          azureServiceConnection: ${{ parameters.azureServiceConnection }}
          azureStorageBlobPath: ${{ parameters.azureStorageBlobPath }}
      - template: /.pipelines/templates/Dacs.PythonTest.Job.yml@self
        parameters:
          architecture: amd64
          acrName: ${{ parameters.acrName }}
          azureServiceConnection: ${{ parameters.azureServiceConnection }}
          azureStorageBlobPath: ${{ parameters.azureStorageBlobPath }}

  - stage: AzureTests_arm64
    displayName: Azure-backed tests linux/arm64
    dependsOn: Build_arm64
    pool:
      name: 1es-dacs-pool-arm64
      image: 1es-pt-linux-arm64
      os: linux
      hostArchitecture: arm64
    jobs:
      - template: /.pipelines/templates/Dacs.StorageTest.Jobs.yml@self
        parameters:
          architecture: arm64
          acrName: ${{ parameters.acrName }}
          azureServiceConnection: ${{ parameters.azureServiceConnection }}
          azureStorageBlobPath: ${{ parameters.azureStorageBlobPath }}
      - template: /.pipelines/templates/Dacs.PythonTest.Job.yml@self
        parameters:
          architecture: arm64
          acrName: ${{ parameters.acrName }}
          azureServiceConnection: ${{ parameters.azureServiceConnection }}
          azureStorageBlobPath: ${{ parameters.azureStorageBlobPath }}

  - stage: Package
    displayName: Package and publish DACS artifacts
    dependsOn:
      - Images_amd64
      - Images_arm64
      - AzureTests_amd64
      - AzureTests_arm64
    condition: >-
      and(
        in(dependencies.Images_amd64.result, 'Succeeded', 'SucceededWithIssues'),
        in(dependencies.Images_arm64.result, 'Succeeded', 'SucceededWithIssues'),
        in(dependencies.AzureTests_amd64.result, 'Succeeded', 'SucceededWithIssues'),
        in(dependencies.AzureTests_arm64.result, 'Succeeded', 'SucceededWithIssues')
      )
    jobs:
      - job: Package
        displayName: Package artifacts
        timeoutInMinutes: 120
        templateContext:
          outputs:
            - output: pipelineArtifact
              path: $(Build.ArtifactStagingDirectory)/release
              artifact: dacs-release
        steps:
          - checkout: self
            path: s/dacs
            fetchDepth: 0
            fetchTags: true
          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: 3.21.3
          - template: /.pipelines/templates/Dacs.Version.Steps.yml@self
          - task: DownloadPipelineArtifact@2
            displayName: Download linux/amd64 build artifacts
            inputs:
              buildType: current
              artifact: dacs-build-linux-amd64
              targetPath: $(Pipeline.Workspace)/feed-artifacts/amd64
          - task: DownloadPipelineArtifact@2
            displayName: Download linux/arm64 build artifacts
            inputs:
              buildType: current
              artifact: dacs-build-linux-arm64
              targetPath: $(Pipeline.Workspace)/feed-artifacts/arm64
          - bash: |
              set -euo pipefail
              helm version
              git version
            displayName: Check packaging tools
          - bash: |
              set -euo pipefail
              readonly registry="${{ parameters.acrName }}.azurecr.io"
              export DOCKER_REGISTRY="$registry"
              ./.pipelines/scripts/publish/publish-helm-chart.sh

              readonly release_artifacts="$(Build.ArtifactStagingDirectory)/release"
              readonly helm_artifacts="$release_artifacts/helm-charts"
              readonly release_metadata="$release_artifacts/release-metadata"
              readonly package_artifacts="$release_artifacts/packages"
              readonly source_version="$(./.pipelines/scripts/get-version.sh source)"
              readonly container_version="$(finalTag)"
              readonly python_version="$(./.pipelines/scripts/get-version.sh python)"
              readonly rust_version="$(./.pipelines/scripts/get-version.sh rust)"
              readonly universal_version="$(./.pipelines/scripts/get-version.sh universal)"
              readonly git_commit="$(git rev-parse HEAD)"
              mkdir -p "$helm_artifacts" "$release_metadata"

              ./.pipelines/scripts/build/prepare-package-artifacts.sh \
                "$(Pipeline.Workspace)/feed-artifacts/amd64" \
                "$(Pipeline.Workspace)/feed-artifacts/arm64" \
                "$package_artifacts"

              cp dist/*.tgz "$helm_artifacts/"
              cp helm-chart.txt "$helm_artifacts/"
              (
                cd "$helm_artifacts"
                sha256sum ./*.tgz helm-chart.txt > SHA256SUMS
              )

              printf '%s\n' \
                "SOURCE_VERSION=$source_version" \
                "CONTAINER_VERSION=$container_version" \
                "GIT_COMMIT=$git_commit" \
                "CACHE_SERVER_IMAGE=$registry/dacs/cache-server:${container_version}-linux-{amd64,arm64}" \
                "CACHE_CLIENT_IMAGE=$registry/dacs/cache-test-client:${container_version}-linux-{amd64,arm64}" \
                "CACHE_SERVER_SCHEDULER_IMAGE=$registry/dacs/cacheserver-scheduler:${container_version}-linux-{amd64,arm64}" \
                "CACHE_CONTROLLER_IMAGE=$registry/dacs/cache-controller:${container_version}-linux-{amd64,arm64}" \
                > "$release_metadata/docker-images.txt"
              cp helm-chart.txt "$release_metadata/"

              printf '%s\n' \
                "SOURCE_VERSION=$source_version" \
                "CONTAINER_VERSION=$container_version" \
                "PYTHON_PACKAGE_NAME=dacs-client" \
                "PYTHON_PACKAGE_VERSION=$python_version" \
                "RUST_PACKAGE_NAME=dacs-rust-client" \
                "RUST_PACKAGE_VERSION=$rust_version" \
                "UNIVERSAL_PACKAGE_VERSION=$universal_version" \
                "STORAGE_AMD64_PACKAGE_NAME=dacs-storage-amd64" \
                "STORAGE_ARM64_PACKAGE_NAME=dacs-storage-arm64" \
                "CACHE_CLIENT_AMD64_PACKAGE_NAME=dacs-storage-cache-client-amd64" \
                "CACHE_CLIENT_ARM64_PACKAGE_NAME=dacs-storage-cache-client-arm64" \
                "AKS_TEST_AMD64_PACKAGE_NAME=dacs-aks-tests-amd64" \
                "AKS_TEST_ARM64_PACKAGE_NAME=dacs-aks-tests-arm64" \
                "GIT_COMMIT=$git_commit" \
                "SOURCE_BUILD_ID=$(Build.BuildId)" \
                "IMAGE_REGISTRY=$registry/dacs" \
                > "$release_metadata/release.env"
            displayName: Package versioned artifacts
            workingDirectory: $(Pipeline.Workspace)/s/dacs

          - task: AzureCLI@2
            displayName: Promote candidate images
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(Pipeline.Workspace)/s/dacs
              inlineScript: |
                set -euo pipefail

                az acr login --name "${{ parameters.acrName }}"
                DOCKER_REGISTRY="${{ parameters.acrName }}.azurecr.io/dacs" \
                BUILD_ID="$(Build.BuildId)" \
                BUILD_NUMBER="$(finalTag)" \
                BUILD_ARCHS="amd64 arm64" \
                  ./.pipelines/scripts/publish/promote-candidate-images.sh

          - task: AzureCLI@2
            displayName: Publish immutable Helm charts
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                readonly chart_artifacts="$(Build.ArtifactStagingDirectory)/release/helm-charts"
                readonly chart_metadata="$chart_artifacts/helm-chart.txt"
                test -f "$chart_metadata"

                (
                  cd "$chart_artifacts"
                  sha256sum -c SHA256SUMS
                )

                # shellcheck disable=SC1090
                source "$chart_metadata"
                : "${CHART_REPO:?chart metadata is missing CHART_REPO}"
                : "${CACHE_SERVER_CHART_VERSION:?chart metadata is missing CACHE_SERVER_CHART_VERSION}"
                : "${CACHE_SERVER_PREREQ_CHART_VERSION:?chart metadata is missing CACHE_SERVER_PREREQ_CHART_VERSION}"
                : "${CACHE_CONTROLLER_CHART_VERSION:?chart metadata is missing CACHE_CONTROLLER_CHART_VERSION}"

                readonly charts=(
                  "$chart_artifacts/cache-server-$CACHE_SERVER_CHART_VERSION.tgz"
                  "$chart_artifacts/dacs-prereq-$CACHE_SERVER_PREREQ_CHART_VERSION.tgz"
                  "$chart_artifacts/dacs-$CACHE_CONTROLLER_CHART_VERSION.tgz"
                )
                for chart in "${charts[@]}"; do
                  test -f "$chart"
                done

                az acr login --name "${{ parameters.acrName }}"
                for chart in "${charts[@]}"; do
                  helm push "$chart" "$CHART_REPO"
                done
