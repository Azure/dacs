# Shared lifecycle for DACS AKS integration stages. Each invocation provisions
# and deletes its own cluster so failures remain isolated by test category.

parameters:
  - name: testFilter
    type: string

  - name: stageName
    type: string

  - name: stageDisplayName
    type: string

  - name: location
    type: string
    default: westus2

  - name: aksTemplate
    type: string
    default: nvme-l8

  - name: dacsBuildNumber
    type: string
    default: latest

  - name: helmArgs
    type: string
    default: --values src/subsystems/cache-controller/charts/dacs/perf-values.yaml

  - name: resourceGroupPrefix
    type: string
    default: dacs-integration

  - name: testOutputFile
    type: string
    default: test.xml

  - name: extraTestEnv
    type: string
    default: ""

  - name: extraTestArgs
    type: string
    default: ""

  - name: baselineChart
    type: string
    default: ""

  - name: baselineChartVersion
    type: string
    default: ""

  - name: condition
    type: string
    default: ""

  - name: dependsOn
    type: object
    default: ""

  - name: azureServiceConnection
    type: string
    default: dacs ARM Connection

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.stageDisplayName }}
    ${{ if parameters.dependsOn }}:
      dependsOn: ${{ parameters.dependsOn }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    jobs:
      - job: test
        displayName: Run ${{ parameters.stageDisplayName }}
        timeoutInMinutes: 240
        variables:
          ob_outputDirectory: $(Build.SourcesDirectory)/out
          resourceGroup: ${{ parameters.resourceGroupPrefix }}-$(Build.BuildId)
        steps:
          - checkout: self
            path: s/dacs
            fetchDepth: 1

          - download: dacsOfficial
            artifact: release-metadata
            displayName: Download official release metadata

          - download: dacsOfficial
            artifact: helm-charts
            displayName: Download official Helm charts

          - bash: |
              set -euo pipefail

              readonly release_dir="$(Pipeline.Workspace)/dacsOfficial/release-metadata"
              readonly helm_dir="$(Pipeline.Workspace)/dacsOfficial/helm-charts"
              readonly release_file="$release_dir/release.env"
              readonly helm_file="$release_dir/helm-chart.txt"
              test -f "$release_file"
              test -f "$helm_file"
              test -f "$helm_dir/SHA256SUMS"

              (
                cd "$helm_dir"
                sha256sum --check SHA256SUMS
              )

              # shellcheck disable=SC1090
              source "$release_file"
              # shellcheck disable=SC1090
              source "$helm_file"
              : "${CONTAINER_VERSION:?release metadata is missing CONTAINER_VERSION}"
              : "${IMAGE_REGISTRY:?release metadata is missing IMAGE_REGISTRY}"
              : "${CACHE_CONTROLLER_CHART_VERSION:?release metadata is missing CACHE_CONTROLLER_CHART_VERSION}"

              build_number="$REQUESTED_DACS_BUILD"
              if [[ "$build_number" == "latest" ]]; then
                build_number="$CONTAINER_VERSION"
              fi

              registry_host="${IMAGE_REGISTRY%/dacs}"
              target_chart="$helm_dir/dacs-${CACHE_CONTROLLER_CHART_VERSION}.tgz"
              test -f "$target_chart"

              echo "Official pipeline run: $(resources.pipeline.dacsOfficial.runName)"
              echo "Using DACS image version: $build_number"
              echo "Using official image version: $CONTAINER_VERSION"
              echo "Using DACS image registry: $IMAGE_REGISTRY"
              echo "Using DACS chart: $target_chart"
              echo "##vso[task.setvariable variable=dacsBuildNumber]$build_number"
              echo "##vso[task.setvariable variable=officialContainerVersion]$CONTAINER_VERSION"
              echo "##vso[task.setvariable variable=dacsImageRegistry]$IMAGE_REGISTRY"
              echo "##vso[task.setvariable variable=dacsRegistryHost]$registry_host"
              echo "##vso[task.setvariable variable=dacsChartVersion]$CACHE_CONTROLLER_CHART_VERSION"
              echo "##vso[task.setvariable variable=dacsTargetChart]$target_chart"
            displayName: Resolve DACS build
            env:
              REQUESTED_DACS_BUILD: ${{ parameters.dacsBuildNumber }}

          - bash: |
              set -euo pipefail

              packages=()
              command -v az >/dev/null 2>&1 || packages+=(azure-cli)
              command -v curl >/dev/null 2>&1 || packages+=(curl)
              command -v git >/dev/null 2>&1 || packages+=(git)
              command -v go >/dev/null 2>&1 || packages+=(golang)
              command -v jq >/dev/null 2>&1 || packages+=(jq)
              command -v kubectl >/dev/null 2>&1 || packages+=(kubectl)
              command -v make >/dev/null 2>&1 || packages+=(make)
              if [[ "${#packages[@]}" -gt 0 ]]; then
                sudo tdnf install -y "${packages[@]}"
              fi
            displayName: Install integration tools

          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: 3.18.6

          - task: AzureCLI@2
            displayName: Create AKS cluster
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                DOCKER_REGISTRY="$(dacsRegistryHost)" \
                  make provision \
                    TARGET=aks \
                    AKS_TEMPLATE=${{ parameters.aksTemplate }} \
                    AKS_LOCATION=${{ parameters.location }} \
                    AKS_RESOURCE_GROUP=$(resourceGroup) \
                    AKS_IS_TEST=true

                storage_account="$(az storage account list \
                  --resource-group "$(resourceGroup)" \
                  --query "[?tags.purpose == 'dacs-test'] | [0].name" \
                  --output tsv)"
                test -n "$storage_account"
                echo "##vso[task.setvariable variable=storageAccountName]$storage_account"
            workingDirectory: $(Pipeline.Workspace)/s/dacs

          - task: AzureCLI@2
            displayName: Deploy DACS prerequisites
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                make helm-prereq-install
            workingDirectory: $(Pipeline.Workspace)/s/dacs

          - task: AzureCLI@2
            displayName: Deploy DACS
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                if [[ -n "$BASELINE_CHART" ]]; then
                  : "${BASELINE_CHART_VERSION:?baseline chart version is required}"
                  baseline_registry="${BASELINE_CHART#oci://}"
                  baseline_registry="${baseline_registry%%/*}"
                  acr_name="${baseline_registry%%.*}"
                  token="$(az acr login \
                    --name "$acr_name" \
                    --expose-token \
                    --output tsv \
                    --query accessToken)"
                  test -n "$token"
                  echo "$token" | helm registry login "$baseline_registry" \
                    --username 00000000-0000-0000-0000-000000000000 \
                    --password-stdin

                  helm upgrade --install dacs "$BASELINE_CHART" \
                    --version "$BASELINE_CHART_VERSION" \
                    --namespace cache-server \
                    --create-namespace \
                    --wait \
                    --timeout 10m \
                    --atomic \
                    ${{ parameters.helmArgs }}
                else
                  make helm-dacs-install-local-chart \
                    DACS_IMAGE_REGISTRY="$(dacsImageRegistry)" \
                    IMAGE_TAG="$(dacsBuildNumber)" \
                    HELM_ARGS="${{ parameters.helmArgs }}"
                fi

                kubectl wait \
                  --for=condition=Ready \
                  caches.storage.azure.com \
                  --all \
                  --all-namespaces \
                  --timeout=10m
            workingDirectory: $(Pipeline.Workspace)/s/dacs
            env:
              BASELINE_CHART: ${{ parameters.baselineChart }}
              BASELINE_CHART_VERSION: ${{ parameters.baselineChartVersion }}

          - task: AzureCLI@2
            displayName: Run test (${{ parameters.testFilter }})
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                export DOCKER_REGISTRY="$(dacsImageRegistry)"
                export BUILD_NUMBER="$(dacsBuildNumber)"
                export BUILD_DEFINITION_NAME="$(Build.DefinitionName)"
                export BUILD_NUM="$(Build.BuildNumber)"
                export GIT_BRANCH="$(Build.SourceBranchName)"
                ${{ parameters.extraTestEnv }}

                make test-e2e \
                  TEST_FILTER="${{ parameters.testFilter }}" \
                  TEST_OUTPUT="${{ parameters.testOutputFile }}" \
                  SUPPORT_BUNDLE_OUTPUT_DIR="support-bundles/${{ parameters.stageName }}" \
                  EXTRA_TEST_ARGS="${{ parameters.extraTestArgs }}"
            workingDirectory: $(Pipeline.Workspace)/s/dacs

          - bash: |
              if [[ -f diagnostic-links.md ]]; then
                echo "===== diagnostic-links.md ====="
                cat diagnostic-links.md
                echo "===== end diagnostic-links.md ====="
              else
                echo "diagnostic-links.md was not produced"
              fi
            displayName: Publish diagnostic links
            condition: always()
            workingDirectory: $(Pipeline.Workspace)/s/dacs

          - task: CopyFiles@2
            displayName: Copy diagnostic links to output
            condition: always()
            inputs:
              sourceFolder: $(Pipeline.Workspace)/s/dacs
              contents: diagnostic-links.md
              targetFolder: $(ob_outputDirectory)/diagnostic-links/${{ parameters.stageName }}

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: ${{ parameters.testOutputFile }}
              searchFolder: $(Pipeline.Workspace)/s/dacs
              failTaskOnFailedTests: true
              testRunTitle: ${{ parameters.stageDisplayName }}

          - task: CopyFiles@2
            displayName: Copy support bundles to output
            condition: always()
            inputs:
              sourceFolder: $(Pipeline.Workspace)/s/dacs/support-bundles/${{ parameters.stageName }}
              contents: "**"
              targetFolder: $(ob_outputDirectory)/support-bundles/${{ parameters.stageName }}

          - task: AzureCLI@2
            displayName: Delete AKS cluster
            condition: always()
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                make aks-clean AKS_RESOURCE_GROUP=$(resourceGroup)
            workingDirectory: $(Pipeline.Workspace)/s/dacs
