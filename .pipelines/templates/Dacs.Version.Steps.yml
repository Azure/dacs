steps:
  - bash: |
      set -euo pipefail
      version="$(./.pipelines/scripts/get-version.sh container)"

      echo "Resolved DACS container version: $version"
      echo "##vso[task.setvariable variable=finalTag]$version"
    displayName: Resolve DACS version
    workingDirectory: $(Pipeline.Workspace)/s/dacs
