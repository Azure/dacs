parameters:
  - name: architecture
    type: string
  - name: restoreWheel
    type: boolean
    default: false
  - name: fetchDepth
    type: number
    default: 0
  - name: persistCredentials
    type: boolean
    default: false

steps:
  - checkout: self
    path: s/dacs
    fetchDepth: ${{ parameters.fetchDepth }}
    fetchTags: true
    persistCredentials: ${{ parameters.persistCredentials }}

  - task: DownloadPipelineArtifact@2
    displayName: Download linux/${{ parameters.architecture }} build artifacts
    inputs:
      buildType: current
      artifact: dacs-build-linux-${{ parameters.architecture }}
      targetPath: $(Pipeline.Workspace)/artifacts/build

  - bash: |
      set -euo pipefail

      readonly archive="$(Pipeline.Workspace)/artifacts/build/build-tree/dacs-build-tree-linux-${{ parameters.architecture }}.tar"
      test -f "$archive"
      tar -xf "$archive"
      test -d "bin/Release/${{ parameters.architecture }}"
      test -n "$(find build/Release/${{ parameters.architecture }} -name CTestTestfile.cmake -print -quit)"

      readonly container_build_root="/workspaces/$(basename "$PWD")"
      BUILD_ARCH="${{ parameters.architecture }}" CURRENT_BUILD_ROOT="$container_build_root" python3 - <<'PY'
      import os
      from pathlib import Path

      architecture = os.environ["BUILD_ARCH"]
      current_root = os.environ["CURRENT_BUILD_ROOT"]
      marker = f"/bin/Release/{architecture}/"
      paths = list(Path("build").rglob("CTestTestfile.cmake"))
      roots = set()

      for path in paths:
          for line in path.read_text().splitlines():
              marker_index = line.find(marker)
              if marker_index == -1:
                  continue
              quote_index = line.rfind('"', 0, marker_index)
              if quote_index != -1:
                  root = line[quote_index + 1:marker_index]
                  if root.startswith("/"):
                      roots.add(root)

      if len(roots) != 1:
          raise RuntimeError(f"Expected one CTest build root, found: {sorted(roots)}")

      original_root = roots.pop()
      replacements = 0

      for path in paths:
          contents = path.read_text()
          updated = contents.replace(original_root, current_root)
          if updated != contents:
              path.write_text(updated)
              replacements += 1

      if original_root != current_root and replacements == 0:
          raise RuntimeError(f"CTest metadata does not reference the original build root: {original_root}")
      PY

      find bin -type f -perm /111 -exec chmod a+x {} +
    displayName: Restore linux/${{ parameters.architecture }} build tree
    workingDirectory: $(Pipeline.Workspace)/s/dacs

  - ${{ if eq(parameters.restoreWheel, true) }}:
      - bash: |
          set -euo pipefail

          readonly wheel_source="$(Pipeline.Workspace)/artifacts/build/python-wheel"
          readonly wheel_destination="$(Pipeline.Workspace)/s/dacs/src/subsystems/storage/dacs_client/dist"
          test -n "$(find "$wheel_source" -maxdepth 1 -name '*.whl' -print -quit)"
          mkdir -p "$wheel_destination"
          cp "$wheel_source"/*.whl "$wheel_destination/"
        displayName: Restore linux/${{ parameters.architecture }} Python wheel
