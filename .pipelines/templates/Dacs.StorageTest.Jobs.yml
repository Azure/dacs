parameters:
  - name: architecture
    type: string
  - name: acrName
    type: string
  - name: azureServiceConnection
    type: string
  - name: azureStorageBlobPath
    type: string
  - name: advancedTestGroups
    type: object
    default:
      - name: Cache
        value: cache
      - name: Encryption
        value: encryption
  - name: specializedTestGroups
    type: object
    default:
      - name: Snapshot
        value: snapshot
      - name: Eviction
        value: eviction
      - name: Remote
        value: remote

jobs:
  - job: ServerlessTests_${{ parameters.architecture }}
    displayName: ${{ parameters.architecture }} - Serverless tests
    timeoutInMinutes: 60
    steps:
      - template: Dacs.RestoreBuild.Steps.yml
        parameters:
          architecture: ${{ parameters.architecture }}
      - template: Dacs.AzureAuthentication.Steps.yml
        parameters:
          architecture: ${{ parameters.architecture }}
          acrName: ${{ parameters.acrName }}
          azureServiceConnection: ${{ parameters.azureServiceConnection }}
          azureStorageBlobPath: ${{ parameters.azureStorageBlobPath }}
      - task: CargoAuthenticate@0
        displayName: Authenticate to Cargo package feed
        inputs:
          configFile: $(Pipeline.Workspace)/s/dacs/.cargo/cfs-config.toml
      - bash: |
          set -euo pipefail
          BUILD_ARCH="${{ parameters.architecture }}" \
          DOCKER_REGISTRY="${{ parameters.acrName }}.azurecr.io" \
          USE_AZURE_CFS=true \
          DACS_AZURE_STORAGE_ACCOUNT="$(DACS_AZURE_STORAGE_ACCOUNT)" \
          DACS_AZURE_STORAGE_CONTAINER="$(DACS_AZURE_STORAGE_CONTAINER)" \
          SI_azBlobAccessToken="$(SI_azBlobAccessToken)" \
            ./bldenv.sh /usr/bin/env \
              ADO_PIPELINE=true \
              SKIP_PERF_BENCHMARK=true \
              ./src/subsystems/storage/storage_intercept/integration_tests/test_serverless.sh Release
        workingDirectory: $(Pipeline.Workspace)/s/dacs
        displayName: Run serverless Azure tests
        env:
          SI_azBlobAccessToken: $(SI_azBlobAccessToken)
      - bash: |
          set -euo pipefail
          readonly dacs_lib_path="/workspaces/$(basename "$PWD")/bin/Release/${{ parameters.architecture }}/native-storage/storage/libStorageDirect.so"
          BUILD_ARCH="${{ parameters.architecture }}" \
          DOCKER_REGISTRY="${{ parameters.acrName }}.azurecr.io" \
          USE_AZURE_CFS=true \
          DACS_LIB_PATH="$dacs_lib_path" \
          DACS_TEST_BLOB_PATH="$DACS_AZURE_STORAGE_BLOB_PATH" \
          SI_azBlobAccessToken="$(SI_azBlobAccessToken)" \
            make test-rust-client-integration BUILD_TYPE=Release
        workingDirectory: $(Pipeline.Workspace)/s/dacs
        displayName: Run Rust client Azure integration tests
        env:
          DACS_AZURE_STORAGE_BLOB_PATH: ${{ parameters.azureStorageBlobPath }}
          SI_azBlobAccessToken: $(SI_azBlobAccessToken)

  - job: CacheBasicTests_${{ parameters.architecture }}
    displayName: ${{ parameters.architecture }} - Cache basic tests
    timeoutInMinutes: 60
    steps:
      - template: Dacs.RestoreBuild.Steps.yml
        parameters:
          architecture: ${{ parameters.architecture }}
      - template: Dacs.AzureAuthentication.Steps.yml
        parameters:
          architecture: ${{ parameters.architecture }}
          acrName: ${{ parameters.acrName }}
          azureServiceConnection: ${{ parameters.azureServiceConnection }}
          azureStorageBlobPath: ${{ parameters.azureStorageBlobPath }}
      - task: CargoAuthenticate@0
        displayName: Authenticate to Cargo package feed
        inputs:
          configFile: $(Pipeline.Workspace)/s/dacs/.cargo/cfs-config.toml
      - bash: |
          set -euo pipefail
          BUILD_ARCH="${{ parameters.architecture }}" \
          DOCKER_REGISTRY="${{ parameters.acrName }}.azurecr.io" \
          USE_AZURE_CFS=true \
          DACS_AZURE_STORAGE_ACCOUNT="$(DACS_AZURE_STORAGE_ACCOUNT)" \
          DACS_AZURE_STORAGE_CONTAINER="$(DACS_AZURE_STORAGE_CONTAINER)" \
          SI_azBlobAccessToken="$(SI_azBlobAccessToken)" \
            ./bldenv.sh /usr/bin/env \
              ADO_PIPELINE=true \
              ./src/subsystems/storage/storage_intercept/integration_tests/test_cache_basic.sh Release
        workingDirectory: $(Pipeline.Workspace)/s/dacs
        displayName: Run cache basic Azure integration tests
        env:
          SI_azBlobAccessToken: $(SI_azBlobAccessToken)

  - ${{ each testGroup in parameters.advancedTestGroups }}:
      - job: CacheAdvancedTests_${{ parameters.architecture }}_${{ testGroup.value }}
        displayName: ${{ parameters.architecture }} - Cache advanced (${{ testGroup.name }})
        timeoutInMinutes: 60
        steps:
          - template: Dacs.RestoreBuild.Steps.yml
            parameters:
              architecture: ${{ parameters.architecture }}
          - template: Dacs.AzureAuthentication.Steps.yml
            parameters:
              architecture: ${{ parameters.architecture }}
              acrName: ${{ parameters.acrName }}
              azureServiceConnection: ${{ parameters.azureServiceConnection }}
              azureStorageBlobPath: ${{ parameters.azureStorageBlobPath }}
          - bash: |
              set -euo pipefail
              BUILD_ARCH="${{ parameters.architecture }}" \
              DOCKER_REGISTRY="${{ parameters.acrName }}.azurecr.io" \
              USE_AZURE_CFS=true \
              DACS_AZURE_STORAGE_ACCOUNT="$(DACS_AZURE_STORAGE_ACCOUNT)" \
              DACS_AZURE_STORAGE_CONTAINER="$(DACS_AZURE_STORAGE_CONTAINER)" \
              SI_azBlobAccessToken="$(SI_azBlobAccessToken)" \
                ./bldenv.sh /usr/bin/env \
                  ADO_PIPELINE=true \
                  DACS_TEST_GROUP="${{ testGroup.value }}" \
                  ./src/subsystems/storage/storage_intercept/integration_tests/test_cache_advanced.sh Release
            workingDirectory: $(Pipeline.Workspace)/s/dacs
            displayName: Run cache advanced ${{ testGroup.value }} tests
            env:
              SI_azBlobAccessToken: $(SI_azBlobAccessToken)
          - bash: |
              set -euo pipefail
              echo "Fuse client error logs:"
              cat ./singularityfs.err 2>/dev/null || echo "No error logs found"
              echo ""
              echo "Fuse client output logs:"
              cat ./singularityfs.log 2>/dev/null || echo "No output logs found"
            workingDirectory: $(Pipeline.Workspace)/s/dacs
            displayName: Print Fuse client logs
            condition: succeededOrFailed()

  - ${{ each testGroup in parameters.specializedTestGroups }}:
      - job: CacheSpecializedTests_${{ parameters.architecture }}_${{ testGroup.value }}
        displayName: ${{ parameters.architecture }} - Cache specialized (${{ testGroup.name }})
        timeoutInMinutes: 60
        steps:
          - template: Dacs.RestoreBuild.Steps.yml
            parameters:
              architecture: ${{ parameters.architecture }}
          - template: Dacs.AzureAuthentication.Steps.yml
            parameters:
              architecture: ${{ parameters.architecture }}
              acrName: ${{ parameters.acrName }}
              azureServiceConnection: ${{ parameters.azureServiceConnection }}
              azureStorageBlobPath: ${{ parameters.azureStorageBlobPath }}
          - bash: |
              set -euo pipefail
              BUILD_ARCH="${{ parameters.architecture }}" \
              DOCKER_REGISTRY="${{ parameters.acrName }}.azurecr.io" \
              USE_AZURE_CFS=true \
              DACS_AZURE_STORAGE_ACCOUNT="$(DACS_AZURE_STORAGE_ACCOUNT)" \
              DACS_AZURE_STORAGE_CONTAINER="$(DACS_AZURE_STORAGE_CONTAINER)" \
              SI_azBlobAccessToken="$(SI_azBlobAccessToken)" \
                ./bldenv.sh /usr/bin/env \
                  ADO_PIPELINE=true \
                  DACS_TEST_GROUP="${{ testGroup.value }}" \
                  ./src/subsystems/storage/storage_intercept/integration_tests/test_cache_specialized.sh Release
            workingDirectory: $(Pipeline.Workspace)/s/dacs
            displayName: Run cache specialized ${{ testGroup.value }} tests
            env:
              SI_azBlobAccessToken: $(SI_azBlobAccessToken)
