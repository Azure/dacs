parameters:
  - name: architecture
    type: string
  - name: acrName
    type: string
  - name: azureServiceConnection
    type: string
  - name: buildCacheScope
    type: string
  - name: retainImageArchives
    type: boolean
    default: false

steps:
  - template: Dacs.RestoreBuild.Steps.yml
    parameters:
      architecture: ${{ parameters.architecture }}
      fetchDepth: 0
      persistCredentials: true

  - bash: |
      set -euo pipefail

      if [ "${{ parameters.architecture }}" = "arm64" ]; then
        packages=()
        command -v make >/dev/null 2>&1 || packages+=(make)
        command -v az >/dev/null 2>&1 || packages+=(ca-certificates azure-cli)
        command -v git >/dev/null 2>&1 || packages+=(git)
        command -v go >/dev/null 2>&1 || packages+=(golang)

        if [ "${#packages[@]}" -gt 0 ]; then
          echo "Installing missing ARM64 image build tools: ${packages[*]}"
          sudo tdnf install -y "${packages[@]}"
        fi
      fi

      docker version
      docker buildx version
      make --version
      az version
      git --version
    displayName: Check linux/${{ parameters.architecture }} image build tools

  - task: AzureCLI@2
    displayName: Sign in to ACR
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: az acr login --name "${{ parameters.acrName }}"

  - task: PipAuthenticate@1
    displayName: Authenticate to Python package feed
    inputs:
      artifactFeeds: One/One_PublicPackages

  - bash: |
      set -euo pipefail

      USE_AZURE_CFS=true \
      ENABLE_REGISTRY_BUILD_CACHE=true \
      DOCKER_REGISTRY="${{ parameters.acrName }}.azurecr.io" \
      BUILD_TYPE=Release \
      BUILD_ARCH="${{ parameters.architecture }}" \
      BUILD_CACHE_SCOPE="${{ parameters.buildCacheScope }}" \
        make images
    displayName: Build linux/${{ parameters.architecture }} images
    workingDirectory: $(Pipeline.Workspace)/s/dacs

  - ${{ if parameters.retainImageArchives }}:
      - bash: |
          set -euo pipefail

          DOCKER_REGISTRY="${{ parameters.acrName }}.azurecr.io/dacs" \
          BUILD_NUMBER="$(finalTag)" \
          BUILD_ARCH="${{ parameters.architecture }}" \
          OUTPUT_DIR="$(Build.ArtifactStagingDirectory)/images" \
            ./.pipelines/scripts/publish/save-image-tarballs.sh
        displayName: Archive linux/${{ parameters.architecture }} images
        workingDirectory: $(Pipeline.Workspace)/s/dacs

  - bash: |
      set -euo pipefail

      DOCKER_REGISTRY="${{ parameters.acrName }}.azurecr.io/dacs" \
      BUILD_ID="$(Build.BuildId)" \
      BUILD_ARCH="${{ parameters.architecture }}" \
        ./.pipelines/scripts/publish/push-candidate-images.sh
    displayName: Push linux/${{ parameters.architecture }} candidate images
    workingDirectory: $(Pipeline.Workspace)/s/dacs
