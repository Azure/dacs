apiVersion: batch/v1
kind: Job
metadata:
  name: MODE_PLACEHOLDER-client
  namespace: NAMESPACE_PLACEHOLDER
spec:
  ttlSecondsAfterFinished: 60
  manualSelector: true
  selector:
    matchLabels:
      app: MODE_PLACEHOLDER-client
  parallelism: 1
  template:
    metadata:
      labels:
        app: MODE_PLACEHOLDER-client
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: dacs.azure.com/processing-unit
                operator: In
                values:
                - cpu
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - cacheserver
            topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - MODE_PLACEHOLDER-client
              topologyKey: kubernetes.io/hostname
      containers:
      - name: job
        image: cache-test-client:local
        command: ['/app/PerfClient']
        args: ['--server-port', '9065', '--server-hostname', 'cacheserver-0.cacheserver.default.svc.cluster.local#cacheserver-1.cacheserver.default.svc.cluster.local#cacheserver-2.cacheserver.default.svc.cluster.local', '--num-threads', '1', '--data-size-GiB', '1', '--prefix', 'test', '--mode', 'MODE_PLACEHOLDER', '--num-iterations', '1', '--ib-enabled', 'false']
      restartPolicy: Never