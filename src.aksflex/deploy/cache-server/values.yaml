## global
global:
  registry: {{cnf["registry"]}}
  prefix: {{cnf["prefix"]}}
  version: {{cnf["version"]}}

## settings from Azure
Azure:
  containerRegistry:
    repository:
    username:
    password:

## Core Components Start
cacheServer:
  enabled: true
  image: cache-server
  numServers: 3
  serverSizeInGB: 10240
  serverThreads: 400
  cpuLimit: 16
  memoryLimitMB: 5000
  evictionEnabled: true
  evictionLastAccessThreshold: 90d
  evictionSizeThreshold: 75
  evictionPassFrequency: 1h
  mountSsdPath: /host/mnt/ssd0
  port: 9065
  metricsPort: 9096
  useEphemeralStorage: false
  nodeSsdPath: /var/lib/containerd # required when useEphemeralStorage is false and useCacheFolder is false. To be removed after all clusters are rebuilt to have dedicated cache folder
  useCacheFolder: true
  nodeCacheFolderPath: /var/lib/ssd/cacheserver # required when useEphemeralStorage is false and useCacheFolder is true.
  nodeSelectorLabelKey: dacs.azure.com/processing-unit
  nodeSelectorLabelValues: [ "cpu" ]
  scheduler:
    enabled: true
    image: cacheserver-scheduler
    debugLevel: "info"
    schedulerPollInterval: 15s
    cacheserverNamespace: azureml

## Core Components end