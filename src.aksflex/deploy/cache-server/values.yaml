## global
global:
  registry: {{cnf["registry"]}}
  prefix: {{cnf["prefix"]}}
  version: {{cnf["version"]}}

## settings from Azure
Azure:
  containerRegistry:
    repository:
    username:
    password:

# -- Node selector for system pod assignment.
nodeSelector:
  dacs.azure.com/processing-unit: system

### Managed-by label (kubernetes.azure.com/managedby)
# Lab clusters: 
# Partner cloud clusters: 
# Azure clusters: 
dacsManagedById: "" # The default value is for Azure clusters

## Core Components Start
cacheServer:
  enabled: false
  image: cache-server
  identifier: ""
  numServers: 1
  serverSizeInGB: 1
  serverThreads: 4
  cpuLimit: 1
  memoryLimitMB: 400
  evictionEnabled: true
  evictionLastAccessThreshold: 30d
  evictionSizeThreshold: 75
  evictionPassFrequency: 1h
  mountSsdPath: /host/mnt/ssd0
  port: 9165
  metricsPort: 9196
  useEphemeralStorage: false
  ibResourceCountLimit: 0
  nodeSsdPath: /var/lib/containerd # required when useEphemeralStorage is false and useCacheFolder is false. To be removed after all clusters are rebuilt to have dedicated cache folder
  useCacheFolder: true
  enableTrafficControl: true # If true, traffic control will be enabled for the cacheserver pods
  nodeCacheFolderPath: /var/lib/ssd/cacheserver # required when useEphemeralStorage is false and { useCacheFolder or useHostPath } is true.
  nodeSelectorLabelKey: dacs.azure.com/processing-unit
  nodeSelectorLabelValues: [ "cpu" ]
  useHostPath: true # If true, PV/PVC will not be created and cacheserver pods will use hostPath for storage
  scheduler:
    enabled: true
    image: cacheserver-scheduler
    debugLevel: "info"
    schedulerPollInterval: 15s
    cacheserverNamespace: cache-server
    enableSchedulerCoordination: true

## Core Components end