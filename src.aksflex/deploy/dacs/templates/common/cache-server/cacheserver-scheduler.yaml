{{- if .Values.cacheServer.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: {{ .Release.Namespace }}
  name: cacheserver-scheduler
  labels:
    app: cacheserver-scheduler
    component: cacheserver-scheduler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cacheserver-scheduler
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: cacheserver-scheduler
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: system:kube-scheduler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cacheserver-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    app: cacheserver-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cacheserver-scheduler
  template:
    metadata:
      labels:
        app: cacheserver-scheduler
    spec:
      serviceAccount: cacheserver-scheduler
      containers:
        - name: cacheserver-scheduler
          image: {{ include "amlArcExtension.getImage" (dict "image" .Values.cacheServer.scheduler.image "Values" .Values) }}
          imagePullPolicy: Always
          env:
          - name: CACHESERVER_SCHEDULER_LOGLEVEL
            value: {{ .Values.cacheServer.scheduler.debugLevel | quote }}
{{- end }}