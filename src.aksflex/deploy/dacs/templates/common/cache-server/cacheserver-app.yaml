{{- if and .Values.cacheServer.enabled (ne (int .Values.cacheServer.numServers) 0)}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cacheserver
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: cacheserver
  serviceName: cacheserver
  replicas: {{ .Values.cacheServer.numServers }}
  template:
    metadata:
      labels:
        app: cacheserver
        kubernetes.azure.com/managedby: {{ .Values.dacsManagedById }}
{{- if and (not .Values.cacheServer.enableTrafficControl) .Values.cacheServer.egressBandwidthInGb }}
      annotations:
        kubernetes.io/egress-bandwidth: {{ .Values.cacheServer.egressBandwidthInGb }}G
{{- end }}
    spec:
      terminationGracePeriodSeconds: 10
{{- if .Values.cacheServer.scheduler.enabled }}
      schedulerName: cacheserver-scheduler
{{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: {{ .Values.cacheServer.nodeSelectorLabelKey }}
                operator: In
                values: {{ toYaml .Values.cacheServer.nodeSelectorLabelValues | nindent 16 }}
{{- if not .Values.cacheServer.useEphemeralStorage }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - cacheserver
            topologyKey: kubernetes.io/hostname
{{- end }}
      containers:
      - name: cacheserver
        image: {{ include "amlArcExtension.getImage" (dict "image" .Values.cacheServer.image "Values" .Values) }}
        imagePullPolicy: Always
        env:
        - name: CACHESERVER_THREADPOOL_SIZE
          value: {{ .Values.cacheServer.serverThreads | quote }}
        - name: TEST_CACHESERVER_ADDR_PORT
          value: {{ .Values.cacheServer.port | quote }}
        - name: CACHESERVER_METRICS_PORT
          value: {{ .Values.cacheServer.metricsPort | quote }}
        - name: CACHESERVER_EVICTION_ENABLED
          value: {{ .Values.cacheServer.evictionEnabled | quote }}
        - name : CACHESERVER_EVICTION_LAST_ACCESS_THRESHOLD
          value : {{ .Values.cacheServer.evictionLastAccessThreshold | quote }}
        - name : CACHESERVER_EVICTION_SIZE_THRESHOLD
          value : {{ .Values.cacheServer.evictionSizeThreshold | quote }}
        - name : CACHESERVER_EVICTION_PASS_FREQUENCY
          value : {{ .Values.cacheServer.evictionPassFrequency | quote }}
{{- if has "gpu" .Values.cacheServer.nodeSelectorLabelValues }}
        resources:
          requests:
            memory: "100Mi"
            cpu: "0.25"
            {{- if .Values.cacheServer.ibResourceCountLimit }}
            rdma/hca_rdma_infiniband: {{ .Values.cacheServer.ibResourceCountLimit | quote }}
            {{- end }}
          limits:
            memory: {{ (printf "%dMi" (int .Values.cacheServer.memoryLimitMB)) | quote }}
            cpu: {{ .Values.cacheServer.cpuLimit | quote }}
            {{- if .Values.cacheServer.ibResourceCountLimit }}
            rdma/hca_rdma_infiniband: {{ .Values.cacheServer.ibResourceCountLimit | quote }}
            {{- end }}
{{- end }}
        ports:
        - containerPort: {{ .Values.cacheServer.port }}
          name : cacheserver
        - containerPort: {{ .Values.cacheServer.metricsPort }}
          name : metrics
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        command: ["/bin/sh", "-cx"]
        args:
        - |
          set -ex
          export CACHESERVER_HOSTNAME=$HOSTNAME
          export CACHESERVER_PORT={{ .Values.cacheServer.port }}
          export CACHESERVER_CACHE_PATH={{ .Values.cacheServer.mountSsdPath }}/{{ .Values.cacheServer.identifier }}/cache
          export CACHESERVER_CACHE_SIZE_BYTES={{ (mul .Values.cacheServer.serverSizeInGB 1024 1024 1024) }}
          mkdir -p $CACHESERVER_CACHE_PATH

          {{- if and .Values.cacheServer.enableTrafficControl .Values.cacheServer.egressBandwidthInGb }}
          echo "Traffic control is enabled"
          BANDWIDTH="{{ .Values.cacheServer.egressBandwidthInGb }}gbit"
          BURST="$(( {{ .Values.cacheServer.egressBandwidthInGb }} * 25 ))mb"
          for iface in $(ls /sys/class/net/ | grep -Ev '^(lo|docker|ib|mlx)'); do
            echo "Applying rate limiting to interface: $iface"
            echo "Setting bandwidth: $BANDWIDTH, burst: ${BURST}"
            if ! tc qdisc add dev $iface root tbf rate $BANDWIDTH burst ${BURST} latency 1000ms; then
              echo "Warning: Failed to apply rate limiting to $iface, continuing..."
            fi
          done

          for iface in $(ls /sys/class/net/ | grep -Ev '^(lo|docker|ib|mlx)'); do
            echo "Rate limiting configuration for $iface:"
            tc qdisc show dev $iface
          done
          {{- else }}
          echo "Traffic control is disabled"
          {{- end }}

          /root/check_space_overuse.sh $CACHESERVER_CACHE_PATH $CACHESERVER_CACHE_SIZE_BYTES
          /root/CacheServer $CACHESERVER_PORT $CACHESERVER_CACHE_PATH $CACHESERVER_CACHE_SIZE_BYTES
        volumeMounts:
        - mountPath: {{ .Values.cacheServer.mountSsdPath }}
          name: cache-data-volume
          subPath: ssd0
        livenessProbe:
          exec:
            command: [
            '/bin/sh',
            '-c',
            '/root/LivenessProbe' ]
          initialDelaySeconds: 300
          periodSeconds: 120
          failureThreshold : 10
      volumes:
        - name: cache-data-volume
{{- if .Values.cacheServer.useEphemeralStorage }}
          emptyDir:
            sizeLimit: {{ (printf "%dGi" (add1 .Values.cacheServer.serverSizeInGB)) }}
{{- else if .Values.cacheServer.useHostPath }}
          hostPath:
            path: {{ .Values.cacheServer.nodeCacheFolderPath }}
            type: Directory
{{- else }}
          hostPath: null
          sizeLimit: null
{{- end }}
{{- end }}
